/* ============================================================
   [V2.1] SIMULAÇÃO — "Novo contato de WhatsApp" vira "Novo Lead"
   ------------------------------------------------------------
   Reproduz, sem nenhuma API real, a regra aprovada para a integração
   futura: número novo → normaliza o telefone → procura paciente pelo
   telefone → se existir, só vincula a conversa; se não existir, cria um
   lead novo (origem WhatsApp, entra em "Novo Paciente" no Kanban).
   Isolado nestas 3 funções pequenas para facilitar a troca pelo webhook
   de verdade depois — o "gatilho" muda (de um clique aqui para uma
   chamada de API), mas a lógica de busca/criação é praticamente a mesma.
   O lead criado aqui SEMPRE fica marcado com `demoWhatsapp:true` e um id
   com prefixo `pac-demo-wa-` — nunca é confundido com os 52 originais.
   ============================================================ */
// Normalização simples (grau de demonstração): mantém só dígitos e remove
// o DDI do Brasil quando presente, para comparar números escritos em
// formatos diferentes. Uma normalização definitiva (E.164 completo) fica
// para quando a API real do WhatsApp for integrada.
function normalizarTelefone(tel){
  if(!tel) return '';
  let d = String(tel).replace(/\D/g,'');
  d = d.replace(/^0+/,'');
  if(d.length>11 && d.startsWith('55')) d = d.slice(2);
  return d;
}
// [Supabase CRUD] Normalização conservadora de telefone brasileiro para
// E.164 — usada só na gravação real (criar/atualizar paciente via RPC).
// Separada de normalizarTelefone() acima, que continua servindo só à
// demonstração de WhatsApp (busca solta por dígitos, não é E.164).
// Nunca inventa DDD nem completa número incompleto: formato ambíguo ou
// insuficiente -> null (nunca lança exceção, nunca assume um valor).
function normalizarTelefoneE164BR(telefoneOriginal){
  if(!telefoneOriginal) return null;
  let d = String(telefoneOriginal).replace(/\D/g,'');
  if(!d) return null;
  d = d.replace(/^0+/, '');
  if(!d) return null;
  if(d.startsWith('55') && (d.length===12 || d.length===13)){
    // já vem com DDI 55 e tamanho compatível com DDD+fixo(8) ou DDD+celular(9)
  } else if(d.length===10 || d.length===11){
    d = '55'+d;
  } else {
    return null;
  }
  return '+'+d;
}
function buscarPacientePorTelefone(telefoneOriginalOuNormalizado){
  const alvo = normalizarTelefone(telefoneOriginalOuNormalizado);
  if(!alvo) return null;
  return DB.pacientes.find(p=>normalizarTelefone(p.telefone)===alvo) || null;
}
function processarNovoContatoWhatsApp(telefoneOriginal, mensagemTexto){
  let paciente = buscarPacientePorTelefone(telefoneOriginal);
  let novo = false;
  if(!paciente){
    paciente = {
      id: uid('pac-demo-wa'),
      nome: 'Novo contato WhatsApp (Demonstração)',
      telefone: telefoneOriginal, email:'', origem:'WhatsApp',
      procedimentos:[], procedimentoOriginal:'', responsavel:'',
      dataContato: hojeISO(), marcouConsulta:'', dataConsulta:'', compareceu:'',
      fezRadiografia:'', planoTratamento:'', valorOrcamento:null,
      fechouTratamento:'', valorFechado:null, dataFechamento:'',
      motivoPerda:'', observacoes:'',
      demoWhatsapp: true, // [V2.1] marca explícita — nunca confundir com os 52 reais
    };
    DB.pacientes.push(paciente);
    novo = true;
  }
  let conversa = DB.whatsappConversas.find(c=>c.pacienteId===paciente.id);
  if(!conversa){
    conversa = { id: uid('wa'), pacienteId: paciente.id, mensagens: [] };
    DB.whatsappConversas.push(conversa);
  }
  conversa.mensagens.push({ autor:'paciente', texto: mensagemTexto, hora: new Date().toISOString() });
  saveState();
  return { paciente, conversa, novo };
}

// [V2.1] Quando uma conversa foi aberta a partir de um Resgate/Follow-up/
// Pós-Venda pendente, mostra um atalho de conclusão direto na conversa —
// para a secretária não precisar voltar para a tela de origem. Some
// sozinho assim que a ação for concluída (por aqui ou pela tela de origem).
function acaoPendenteInfo(conversa){
  if(!conversa || !conversa.contextoAcao) return null;
  const tipo = conversa.contextoAcao.tipo;
  const pacienteId = conversa.pacienteId;
  if(tipo==='resgate' && !acaoComercialConcluida('resgate', pacienteId)){
    return { label:'Ação pendente: Resgate', tipoAttr:'resgate' };
  }
  if(tipo==='followup_plano' && !acaoComercialConcluida('followup_plano', pacienteId)){
    return { label:'Ação pendente: Follow-up de Plano', tipoAttr:'followup_plano' };
  }
  if(tipo==='pos_consulta'){
    // [Fase A] modo Supabase lê de acoes_comerciais (via acaoComercialConcluida);
    // modo local continua lendo DB.posVendasConcluidos, sem alteração.
    const concluida = (typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE)
      ? !!acaoComercialConcluida('pos_consulta', pacienteId)
      : DB.posVendasConcluidos.includes(pacienteId);
    if(!concluida) return { label:'Ação pendente: Pós-Consulta', tipoAttr:'pos_consulta' };
  }
  return null;
}

// Regra do alerta de 2 horas: paciente enviou e a clínica ainda não
// respondeu. "atencao" = entre 90min e 2h; "atrasado" = 2h ou mais.
function statusConversaWhatsapp(conversa){
  if(!conversa.mensagens.length) return { aguardando:false, nivel:'normal', minutos:null };
  const ultima = conversa.mensagens[conversa.mensagens.length-1];
  if(ultima.autor !== 'paciente') return { aguardando:false, nivel:'normal', minutos:null };
  const minutos = Math.max(0, Math.floor((Date.now() - new Date(ultima.hora).getTime())/60000));
  const nivel = minutos>=120 ? 'atrasado' : (minutos>=90 ? 'atencao' : 'normal');
  return { aguardando:true, nivel, minutos };
}
function contarConversasAtrasadas(){
  return DB.whatsappConversas.filter(c=>{ const s=statusConversaWhatsapp(c); return s.aguardando && s.nivel==='atrasado'; }).length;
}
function fmtHoraCurta(iso){
  const d = new Date(iso), hoje = new Date();
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===hoje.toDateString()) return `${hh}:${mm}`;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${hh}:${mm}`;
}

    const oa = a.st.aguardando? ordem[a.st.nivel] : 3;
    const ob = b.st.aguardando? ordem[b.st.nivel] : 3;
    if(oa!==ob) return oa-ob;

          <div class="nm"><span>🆕 Novo contato <span class="pill">Demonstração</span></span></div>
          <div class="muted small">${escapeHtml(novoContato.telefone)}</div>
          <div class="snippet">${escapeHtml(novoContato.mensagem)}</div>
          <div class="small" style="margin-top:4px;color:var(--gold-600);">Clique para simular o recebimento — cria o lead automaticamente</div>
        </div>
      `:''}
      ${conversas.length? conversas.map(({c,contato,st})=>{
        const ultima = c.mensagens[c.mensagens.length-1];
        return `<div class="wa-item ${c.id===whatsappConversaSelecionadaId?'active':''}" data-wa-open="${c.id}">

/* ============================================================
   10c) PÓS-CONSULTA (ex-"Pós-Vendas", V2 / renomeado na Fase A)
   ------------------------------------------------------------
   [Correção pós-homologação Fase A] A regra NÃO é mais uma janela de um
   único dia ("compareceu ontem"). D+1 é a data de ELEGIBILIDADE, não uma
   janela — uma vez elegível, o paciente permanece pendente até existir
   conclusão real em acoes_comerciais (tipo='pos_consulta'), não importa
   há quantos dias. Critério: compareceu='Sim' E hoje >= data_consulta+1
   E ainda não concluído. Usa dataElegivelAcaoComercial('pos_consulta', p)
   — a MESMA função que calcula data_elegivel para a RPC — então a fila
   aqui segue exatamente a mesma semântica que o backend já usa para
   aceitar a conclusão (nenhuma mudança na RPC foi necessária).
   Não depende de ter fechado tratamento. Se não houver nenhum paciente
   real nessa condição (ex: ao testar em outro dia), usa os fictícios de
   DADOS_DEMO_V2 para a tela nunca ficar vazia na demonstração — nunca
   mistura os dois ao mesmo tempo, e os fictícios são sempre visivelmente
   rotulados (esses continuam simulando "consulta exatamente ontem").
   [Fase A] Em modo Supabase, "já concluído?" consulta acoes_comerciais
   (via acaoComercialConcluida) em vez de DB.posVendasConcluidos — ver
   posConsultaConcluida() abaixo. Modo local continua exatamente como
   estava.
   ============================================================ */
function posConsultaConcluida(pacienteId){
  if(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE) return !!acaoComercialConcluida('pos_consulta', pacienteId);
  return DB.posVendasConcluidos.includes(pacienteId);
}
// Dias de atraso desde que a pós-consulta ficou elegível (D+1), não desde
// a consulta em si. No próprio dia em que fica elegível, retorna 0.
function diasAtrasoPosConsulta(dataConsulta){
  const dataElegivel = addDiasISO(dataConsulta, 1);
  const dias = diasEntre(dataElegivel, hojeISO());
  return dias!==null && dias>0 ? dias : 0;
}
function filaPosVenda(){
  const hoje = hojeISO();
  const reais = DB.pacientes
    .filter(p=>{
      if(p.compareceu!=='Sim') return false;
      // [Corte operacional] a data que importa é a do EVENTO (data_consulta),
      // nunca a data de hoje — uma consulta de antes do corte não vira
      // tarefa nova só porque já estamos depois da data de implantação.
      // DB.dataInicioAcoesComerciais é null em modo local (sem corte, igual
      // ao comportamento anterior) e também quando a clínica Supabase
      // ainda não tiver essa configuração preenchida.
      if(DB.dataInicioAcoesComerciais && p.dataConsulta && p.dataConsulta < DB.dataInicioAcoesComerciais) return false;
      const dataElegivel = dataElegivelAcaoComercial('pos_consulta', p);
      return dataElegivel!==null && hoje>=dataElegivel && !posConsultaConcluida(p.id);
    })
    .map(p=>({ id:p.id, nome:p.nome, telefone:p.telefone, procedimentos:p.procedimentos, dataConsulta:p.dataConsulta, demo:false }));
  if(reais.length) return reais;
  // [Limpeza Supabase] nunca completa a fila com pacientes fictícios quando
  // conectado ao banco real — lista vazia é o resultado real e correto.
  if(MODO_SUPABASE) return reais;
  return DADOS_DEMO_V2.posVendaDemoPacientes
    .filter(d=>!DB.posVendasConcluidos.includes(d.id))
    .map(d=>({ id:d.id, nome:d.nome, telefone:d.telefone, procedimentos:d.procedimentos, demo:true }));
}

          <div class="small muted">${(()=>{ const d=diasAtrasoPosConsulta(item.dataConsulta); return d>0? `Pós-consulta pendente há ${d} dia${d>1?'s':''}` : 'Pós-consulta pendente'; })()}</div>`}

/* ============================================================
   10b) RECORRÊNCIA — fila operacional de pacientes que precisam retornar
   ------------------------------------------------------------
   Não é um segundo Kanban: 5 categorias mutuamente exclusivas, só a
   categoria selecionada é renderizada por vez (ver filtroRecorrenciaCategoria,
   classificarCicloRecorrencia() e demais funções de dados já definidas
   antes do roteamento). 100% Supabase — em modo local mostra estado
   indisponível (item 29 do pedido), sem persistência paralela.
   ============================================================ */
function cardRecorrencia(ciclo){
  const categoria = filtroRecorrenciaCategoria;
  const destaque = destacarCicloRecorrenciaId===ciclo.id;
  const respTipo = [ciclo.tipoNome, ciclo.responsavelNome].filter(Boolean).join(' · ');
  const acoesAtivas = categoria!=='finalizados';

  let situacaoHtml = '';
  if(categoria==='atrasados'){
    const dias = diasEntre(ciclo.proximoRetorno, hojeCivilClinica());
    situacaoHtml = `<span class="badge-status" style="background:var(--danger-bg);color:var(--danger);">Atraso: ${dias} dia${dias===1?'':'s'}</span>`;
  } else if(categoria==='hoje'){
    situacaoHtml = `<span class="badge-status" style="background:var(--info-bg);color:var(--info);">Retorno previsto para hoje</span>`;
  } else if(categoria==='proximos7'){
    const dias = diasEntre(hojeCivilClinica(), ciclo.proximoRetorno);
    situacaoHtml = `<span class="badge-status" style="background:var(--warn-bg);color:var(--warn);">Retorno em ${dias} dia${dias===1?'':'s'}</span>`;
  } else if(categoria==='emdia'){
    situacaoHtml = `<span class="muted small">Previsto: ${fmtData(ciclo.proximoRetorno)}</span>`;
  } else if(categoria==='finalizados'){
    situacaoHtml = `<span class="badge-status" style="background:var(--ink-100);color:var(--text-muted);">Encerrado em ${fmtData(ciclo.dataEncerramento)}</span>`;
  }

  return `
  <div class="recorrencia-card ${destaque?'destaque':''}" data-ciclo-recorrencia="${ciclo.id}">
    <div class="info">
      <div class="nm">${escapeHtml(ciclo.pacienteNome)}</div>
      ${respTipo? `<div class="meta">${escapeHtml(respTipo)}</div>` : ''}
      ${categoria!=='finalizados'? `<div class="meta">Previsto: ${fmtData(ciclo.proximoRetorno)}</div>` : ''}
      <div class="situacao">${situacaoHtml}</div>
      ${categoria==='finalizados' && ciclo.motivoEncerramento? `<div class="meta">${escapeHtml(ciclo.motivoEncerramento)}${ciclo.observacaoEncerramento? ' — '+escapeHtml(ciclo.observacaoEncerramento) : ''}</div>` : ''}
    </div>
    <div class="acoes">
      ${acoesAtivas? `
        <button class="btn sm ghost" data-wa-paciente="${ciclo.pacienteId}">WhatsApp</button>
        <button class="btn sm ghost" data-rec-historico="${ciclo.id}">Ver histórico</button>
        <button class="btn sm ghost" data-rec-finalizar="${ciclo.id}">Finalizar recorrência</button>
        <button class="btn sm primary" data-rec-retorno="${ciclo.id}">Registrar retorno</button>
      ` : `
        <button class="btn sm ghost" data-ver-paciente="${ciclo.pacienteId}">Abrir paciente</button>
        <button class="btn sm ghost" data-rec-historico="${ciclo.id}">Ver histórico</button>
      `}
    </div>
  </div>`;
}

  if(!(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE)){
    return `
    <div class="card">
      <h3 style="margin-bottom:2px;">Recorrência de Pacientes</h3>

  // [Navegação contextual] "Abrir na Recorrência" (ver ROUTE_PARAM em
  // navigate()) — consumido uma única vez: seleciona a categoria real do

  // acesso pela barra lateral.
  if(ROUTE_PARAM && ROUTE_PARAM.cicloId){
    const alvo = (DB.ciclosRecorrencia||[]).find(c=>c.id===ROUTE_PARAM.cicloId);

  const grupos = agruparCiclosRecorrenciaPorCategoria();

  return `

    <p class="muted small" style="margin:0 0 16px;">Acompanhe pacientes que precisam retornar à clínica e priorize quem deve ser contatado.</p>

    <div class="indicadores-recorrencia">
      ${CATEGORIAS_RECORRENCIA.map(cat=>`

}

    el.addEventListener('click', async ()=>{
      const ciclo = (DB.ciclosRecorrencia||[]).find(c=>c.id===el.dataset.recFinalizar);
      if(!ciclo) return;
      const valores = await abrirModalFinalizarRecorrencia(ciclo);
      if(!valores) return;
      const resultado = await finalizarCicloRecorrencia({
        cicloId: ciclo.id, dataEncerramento: valores.dataEncerramento,
        motivo: valores.motivo, observacaoEncerramento: valores.observacaoEncerramento,
      });
      if(!resultado.ok){ toast('Não foi possível finalizar a recorrência. Tente novamente.'); return; }
      filtroRecorrenciaCategoria = 'finalizados'; // segue o paciente até onde ele foi
      render();
      toast('Recorrência finalizada.');
    });
  });

  document.querySelectorAll('[data-rec-historico]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ciclo = (DB.ciclosRecorrencia||[]).find(c=>c.id===el.dataset.recHistorico);
      if(ciclo) abrirModalHistoricoCiclo(ciclo);
    });
  });

  // Destaque do deep-link "Abrir na Recorrência" — rola até o card uma
  // única vez (destacarCicloRecorrenciaId já foi consumido em renderRecorrencia()).
  if(destacarCicloRecorrenciaId){
    const el = document.querySelector(`[data-ciclo-recorrencia="${destacarCicloRecorrenciaId}"]`);
    if(el) el.scrollIntoView({ block:'center', behavior:'smooth' });
    destacarCicloRecorrenciaId = null;
  }
}

// [Limpeza Supabase] Em modo Supabase, Configurações é somente leitura e
// mostra dado real (equipe/procedimentos/origens/motivos vindos do banco),
// sem nenhuma informação de briefing/hipótese de cargo nem controle que
// pareça gravar algo que hoje não é persistido em lugar nenhum.
// [Config admin] Modelo de acesso: "pessoa da clínica" (profiles) e
// "usuário com acesso ao CRM" são conceitos diferentes. `ativo` sozinho
// NÃO significa acesso — só auth_user_id presente é login real. Mesma
// regra de negócio já homologada no banco (Fase 0 / role nullable).
function situacaoAcessoPessoa(pessoa){
  if(pessoa.auth_user_id) return pessoa.ativo ? 'ativo' : 'desativado';
  if(pessoa.role && pessoa.ativo) return 'pendente';
  return 'sem_acesso';
}
function rotuloSituacaoAcesso(situacao){
  return { ativo:'Ativo', pendente:'Acesso pendente', desativado:'Acesso desativado', sem_acesso:'Sem acesso' }[situacao] || 'Sem acesso';
}
function badgeSituacaoAcesso(situacao){
  const estilos = {
    ativo: 'background:var(--success-bg);color:var(--success);',
    pendente: 'background:var(--warn-bg);color:var(--warn);',
    desativado: 'background:var(--danger-bg);color:var(--danger);',
    sem_acesso: 'background:var(--ink-100);color:var(--text-muted);',
  };
  return `<span class="badge-status" style="${estilos[situacao]||estilos.sem_acesso}">${rotuloSituacaoAcesso(situacao)}</span>`;
}
function rotuloPermissao(role){
  return { admin:'Administrador', dentista:'Dentista', secretaria:'Secretária' }[role] || '—';
}
function badgeAtivo(ativo){
  return ativo
    ? `<span class="badge-status" style="background:var(--success-bg);color:var(--success);">Ativo</span>`
    : `<span class="badge-status" style="background:var(--ink-100);color:var(--text-muted);">Inativo</span>`;
}

// Mini-modal genérico de formulário (nome + campos extras). Resolve com os
// valores digitados, ou null se cancelado. Reaproveitado por Pessoa,
// Procedimento, Origem e Motivo — evita duplicar o mesmo modal 4x.
function abrirModalFormulario(titulo, campos, valoresIniciais){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-backdrop';
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px;">
        <div class="modal-head">
          <h3>${escapeHtml(titulo)}</h3>
          <button type="button" class="modal-close" data-cfg-form-close>✕</button>
        </div>
        <form id="form-cfg-generico">
          <div class="modal-body">
            ${campos.map(c=>`
              <label class="field"><span class="lbl">${escapeHtml(c.label)}</span>
                <input name="${c.name}" type="${c.type||'text'}" ${c.step?`step="${c.step}"`:''} value="${escapeHtml(valoresIniciais&&valoresIniciais[c.name]!=null?valoresIniciais[c.name]:'')}" ${c.required?'required':''}>
              </label>`).join('')}
          </div>
          <div class="modal-foot">
            <button type="button" class="btn ghost" data-cfg-form-close>Cancelar</button>
            <button type="submit" class="btn primary">Salvar</button>
          </div>
        </form>
      </div>`;
    document.body.appendChild(overlay);
    const finalizar = (valor)=>{ overlay.remove(); resolve(valor); };
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) finalizar(null); });
    overlay.querySelectorAll('[data-cfg-form-close]').forEach(el=>el.addEventListener('click', ()=>finalizar(null)));
    overlay.querySelector('#form-cfg-generico').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const valores = {};
      campos.forEach(c=>{ valores[c.name] = fd.get(c.name); });
      finalizar(valores);
    });
  });
}

async function adicionarPessoaSupabase(){
  const valores = await abrirModalFormulario('Adicionar Pessoa', [
    { name:'nome', label:'Nome', required:true },
    { name:'cargo', label:'Cargo' },
  ]);
  if(!valores) return;
  if(!valores.nome || !valores.nome.trim()){ toast('Informe o nome da pessoa.'); return; }
  const { error } = await window.moriSupabase.from('profiles').insert({
    clinica_id: DB.usuarioAtual.clinicaId,
    nome: valores.nome.trim(),
    cargo: (valores.cargo||'').trim() || null,
    // [Regra de negócio já aprovada] pessoa recém-criada é só "pessoa da
    // clínica" — sem acesso ao CRM até o convite (etapa futura).
    auth_user_id: null,
    role: null,
    ativo: false,
  });
  if(error){ console.error('Falha ao adicionar pessoa.', error); toast('Não foi possível adicionar a pessoa. Tente novamente.'); return; }
  await recarregarListasConfigSupabase();
  render();
  toast('Pessoa adicionada.');
}
async function editarPessoaSupabase(id){
  const pessoa = (DB.equipeSupabase||[]).find(p=>p.id===id);

  const valores = await abrirModalFormulario('Editar Pessoa', [
    { name:'nome', label:'Nome', required:true },
    { name:'cargo', label:'Cargo' },
  ], { nome: pessoa.nome, cargo: pessoa.cargo });
  if(!valores) return;
  if(!valores.nome || !valores.nome.trim()){ toast('Informe o nome da pessoa.'); return; }

  render();
  toast('Pessoa atualizada.');

// Fábrica de CRUD para procedimentos/origens/motivos — as 3 tabelas têm a
// mesma forma (clinica_id, nome, ativo), só procedimentos tem valor_medio
// a mais. Evita escrever a mesma função 3 vezes.
// [Recorrência] `campoExtra` generaliza a fábrica para um 2º campo numérico
// qualquer (além de `comValor`, específico de Procedimentos) — usado por
// Tipos de Recorrência (frequência sugerida em dias). Opcional e
// retrocompatível: Procedimentos/Origens/Motivos continuam exatamente como
// antes (campoExtra undefined não muda nada do comportamento deles).
function criarCrudTabelaConfig(tabela, { comValor, campoExtra } = {}){
  const campos = [{ name:'nome', label:'Nome', required:true }];
  if(comValor) campos.push({ name:'valorMedio', label:'Valor médio (R$)', type:'number', step:'0.01' });
  if(campoExtra) campos.push({ name:campoExtra.name, label:campoExtra.label, type:'number' });

  return {
    async adicionar(){
      const valores = await abrirModalFormulario(`Adicionar`, campos);
      if(!valores) return;
      if(!valores.nome || !valores.nome.trim()){ toast('Informe o nome.'); return; }
      const payload = { clinica_id: DB.usuarioAtual.clinicaId, nome: valores.nome.trim(), ativo: true };
      if(comValor) payload.valor_medio = valores.valorMedio? parseFloat(valores.valorMedio) : 0;
      if(campoExtra) payload[campoExtra.column] = valores[campoExtra.name]? parseInt(valores[campoExtra.name],10) : null;
      const { error } = await window.moriSupabase.from(tabela).insert(payload);
      if(error){ console.error(`Falha ao adicionar em ${tabela}.`, error); toast('Não foi possível adicionar. Tente novamente.'); return; }
      await recarregarListasConfigSupabase();
      render();
      toast('Adicionado com sucesso.');
    },
    async editar(id, atual){
      const valoresIniciais = { nome: atual.nome, valorMedio: atual.valorMedio };
      if(campoExtra) valoresIniciais[campoExtra.name] = atual[campoExtra.name];
      const valores = await abrirModalFormulario(`Editar`, campos, valoresIniciais);
      if(!valores) return;
      if(!valores.nome || !valores.nome.trim()){ toast('Informe o nome.'); return; }
      const payload = { nome: valores.nome.trim() };
      if(comValor) payload.valor_medio = valores.valorMedio? parseFloat(valores.valorMedio) : 0;
      if(campoExtra) payload[campoExtra.column] = valores[campoExtra.name]? parseInt(valores[campoExtra.name],10) : null;
      const { error } = await window.moriSupabase.from(tabela).update(payload).eq('id', id);
      if(error){ console.error(`Falha ao editar em ${tabela}.`, error); toast('Não foi possível salvar. Tente novamente.'); return; }
      await recarregarListasConfigSupabase();
      render();
      toast('Atualizado com sucesso.');
    },
    async alternarAtivo(id, ativoAtual, nome){
      if(ativoAtual && !confirm(`Desativar "${nome}"? Deixa de aparecer como opção em novos cadastros, mas pacientes que já o possuem continuam mostrando normalmente.`)) return;
      const { error } = await window.moriSupabase.from(tabela).update({ ativo: !ativoAtual }).eq('id', id);
      if(error){ console.error(`Falha ao atualizar ativo em ${tabela}.`, error); toast('Não foi possível salvar. Tente novamente.'); return; }
      await recarregarListasConfigSupabase();
      render();
      toast(ativoAtual? 'Desativado com sucesso.' : 'Reativado com sucesso.');
    },
  };
}

function exportBackupJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-crm-${DB.clinica.nome.replace(/\s+/g,'-').toLowerCase()}-${hojeISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup JSON exportado.');
}
function importBackupJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const novo = JSON.parse(ev.target.result);
      if(!novo.pacientes) throw new Error('Arquivo não parece um backup válido.');
      if(confirm('Importar este backup vai substituir todos os dados atuais. Continuar?')){
        DB = novo; saveState(); render(); toast('Backup importado com sucesso.');
      }
    }catch(err){ alert('Erro ao importar backup: '+err.message); }
  };
  reader.readAsText(file);
}
function exportPacientesCSV(){
  const headers = ['Nome','Telefone','Email','Origem','Procedimentos','Responsável','Data 1º Contato','Marcou Consulta','Data Consulta','Compareceu','Fez Radiografia','Plano de Tratamento','Valor Orçamento','Fechou Tratamento','Valor Fechado','Data Fechamento','Motivo da Perda','Status Atual','Observações'];
  const rows = DB.pacientes.map(p=>[
    p.nome,p.telefone,p.email,p.origem,(p.procedimentos||[]).join('; '),p.responsavel,
    fmtData(p.dataContato),p.marcouConsulta,fmtData(p.dataConsulta),p.compareceu,p.fezRadiografia,
    p.planoTratamento,p.valorOrcamento??'',p.fechouTratamento,p.valorFechado??'',fmtData(p.dataFechamento),
    p.motivoPerda,calcStatus(p),p.observacoes
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`pacientes-${DB.clinica.nome.replace(/\s+/g,'-').toLowerCase()}-${hojeISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV de pacientes exportado.');
}

function renderGateSupabase(estado){
  const shell = document.getElementById('app-shell');
  if(estado.tipo==='login'){
    shell.innerHTML = telaLogin(estado.erro, estado.carregando);
    const form = document.getElementById('form-login');
    if(form) form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const dados = new FormData(form);
      await autenticarSupabase(dados.get('email'), dados.get('senha'));
    });
  } else if(estado.tipo==='sem-perfil'){
    shell.innerHTML = telaSemPerfil(estado.identificacao);
    const btn = document.getElementById('btn-sair-sem-perfil');
    if(btn) btn.addEventListener('click', async ()=>{
      await window.moriSupabase.auth.signOut();
      iniciarSupabase();
    });
  } else if(estado.tipo==='erro-perfil'){
    shell.innerHTML = telaErroConsultaPerfil(estado.detalhe);
    const btn = document.getElementById('btn-tentar-novamente-erro-perfil');
    if(btn) btn.addEventListener('click', ()=>{
      iniciarSupabase().catch(e=>{
        console.error('Falha ao tentar novamente.', e);
        renderGateSupabase({tipo:'erro-perfil', detalhe: e.message || 'Erro desconhecido.'});
      });
    });
  }
}

async function autenticarSupabase(email, senha){
  renderGateSupabase({tipo:'login', carregando:true});
  const { error } = await window.moriSupabase.auth.signInWithPassword({ email, password: senha });
  if(error){
    renderGateSupabase({tipo:'login', erro:'E-mail ou senha inválidos.', carregando:false});
    return;
  }
  await carregarAposLogin();
}

// [Supabase] Única função de conversão linha-do-banco → objeto de paciente
// no formato camelCase que as telas do CRM já esperam (mesmo formato de
// SEED_PACIENTES). Nenhuma tela faz esse mapeamento por conta própria.
function mapPacienteSupabaseParaCRM(row, refs){
  const nomeOrigem = row.origem_id ? (refs.origensPorId[row.origem_id]||'') : '';
  const nomeResponsavel = row.responsavel_id ? (refs.profilesPorId[row.responsavel_id]||'') : '';
  const nomeMotivoPerda = row.motivo_perda_id ? (refs.motivosPorId[row.motivo_perda_id]||'') : '';
  const procedimentos = refs.procedimentosPorPaciente[row.id] || [];
  return {
    id: row.id,
    legacyId: row.legacy_id || null,
    nome: row.nome || '',
    telefone: row.telefone_original || '',
    telefoneE164: row.telefone_e164 || null,
    email: row.email || '',
    origem: nomeOrigem,
    // [CRUD] Ids reais preservados ao lado do nome — a gravação (RPC) usa
    // estes ids; a interface continua mostrando só os nomes acima.
    origemId: row.origem_id || null,
    responsavelId: row.responsavel_id || null,
    motivoPerdaId: row.motivo_perda_id || null,
    procedimentos,
    procedimentoOriginal: row.procedimento_original || '',
    responsavel: nomeResponsavel,
    dataContato: row.data_contato || '',
    marcouConsulta: row.marcou_consulta || '',
    dataConsulta: row.data_consulta || '',
    compareceu: row.compareceu || '',
    fezRadiografia: row.fez_radiografia || '',
    planoTratamento: row.plano_tratamento || '',
    dataEnvioPlano: row.data_envio_plano || '',
    valorOrcamento: row.valor_orcamento ?? null,
    fechouTratamento: row.fechou_tratamento || '',
    valorFechado: row.valor_fechado ?? null,
    dataFechamento: row.data_fechamento || '',
    dataPerda: row.data_perda || '',
    motivoPerda: nomeMotivoPerda,
    observacoes: row.observacoes || '',
    // Status calculado pelo banco (pacientes_com_status / calc_status()) —
    // mantido só para conferência; as telas continuam usando calcStatus(p)
    // local, que aplica exatamente a mesma fórmula sobre os campos acima.
    statusBanco: row.status || '',
  };
}

async function carregarAposLogin(){
  const { data: sessao } = await window.moriSupabase.auth.getSession();
  const usuario = sessao && sessao.session ? sessao.session.user : null;
  if(!usuario){
    renderGateSupabase({tipo:'login', erro:null, carregando:false});
    return;
  }
  const { data: perfil, error: erroPerfil } = await window.moriSupabase
    .from('profiles')
    .select('id, clinica_id, nome, cargo, role, ativo')
    .eq('auth_user_id', usuario.id)
    .eq('ativo', true)
    .maybeSingle();

  // [Correção] erroPerfil é uma FALHA TÉCNICA na consulta (ex: erro do
  // Postgres, rede) — um caso bem diferente de "não existe perfil
  // ativo". Tratar os dois como a mesma coisa escondia problemas reais
  // (como a recursão de RLS encontrada em homologação) atrás da mensagem
  // genérica de "Acesso não liberado". Agora cada um tem sua própria tela.
  if(erroPerfil){
    console.error('Erro ao consultar profile no Supabase.', erroPerfil);
    renderGateSupabase({tipo:'erro-perfil', detalhe: erroPerfil.message || erroPerfil.code || 'Erro desconhecido.'});
    return;
  }
  if(!perfil){
    renderGateSupabase({tipo:'sem-perfil', identificacao: usuario.email});
    return;
  }

  try{
    await carregarDadosSupabase(perfil);
  }catch(e){
    console.error('Falha ao carregar dados do Supabase.', e);
    renderGateSupabase({tipo:'login', erro:'Não foi possível carregar os dados da clínica. Tente novamente.', carregando:false});
  }
}

// [Config admin] Constrói todas as listas derivadas (procedimentos,
// origens, motivos, equipe/responsáveis) a partir das linhas cruas das 4
// tabelas auxiliares — usada tanto na carga inicial (carregarDadosSupabase)
// quanto depois de qualquer ação administrativa em Configurações
// (recarregarListasConfigSupabase), sem duplicar a lógica nos dois lugares.
// Preserva DB.procedimentos/DB.origens/DB.motivosPerda no MESMO FORMATO que
// já existia antes desta etapa (procedimentos com {id,nome,valorMedio};
// origens/motivos como string[] de nomes) — só que agora só com os ATIVOS,
// para não oferecê-los em novos cadastros. As versões completas (ativos +
// inativos, com id) ficam em DB.procedimentosTodos/origensTodas/motivosPerdaTodas,
// usadas pela tela de Configurações e pela injeção do valor histórico do
// paciente no modal (ver openPacienteModal).
function aplicarListasAuxiliaresConfig(procRows, origensRows, motivosRows, profilesRows, tiposRecorrenciaRows){
  DB.procedimentosTodos = (procRows||[]).map(p=>({ id:p.id, nome:p.nome, valorMedio:p.valor_medio ?? 0, ativo: p.ativo !== false }));
  DB.procedimentos = DB.procedimentosTodos.filter(p=>p.ativo);
  DB.origensTodas = (origensRows||[]).map(o=>({ id:o.id, nome:o.nome, ativo: o.ativo !== false }));
  DB.origens = DB.origensTodas.filter(o=>o.ativo).map(o=>o.nome);
  DB.motivosPerdaTodas = (motivosRows||[]).map(m=>({ id:m.id, nome:m.nome, ativo: m.ativo !== false }));
  DB.motivosPerda = DB.motivosPerdaTodas.filter(m=>m.ativo).map(m=>m.nome);
  DB.responsaveis = (profilesRows||[]).map(p=>p.nome);
  // [Recorrência] mesmo padrão de procedimentos/origens/motivos — lista
  // configurável, só admin gerencia (ver Configurações).
  DB.tiposRecorrenciaTodos = (tiposRecorrenciaRows||[]).map(t=>({ id:t.id, nome:t.nome, frequenciaDias:t.frequencia_sugerida_dias ?? null, ativo: t.ativo !== false }));
  // Lista completa de profiles (com cargo/role/ativo/auth_user_id) para a
  // tela de Configurações (Equipe) — DB.responsaveis acima guarda só os
  // nomes, que é o que os filtros/modal de Pacientes precisam.
  DB.equipeSupabase = profilesRows || [];

  // [CRUD] Mapas nome->id, derivados dos mesmos id->nome (nenhuma consulta
  // nova ao Supabase). Usados só na hora de montar o payload das RPCs de
  // paciente — a interface continua mostrando/filtrando por nome. Usa a
  // lista COMPLETA (ativos+inativos) para que um paciente histórico cujo
  // registro foi desativado continue resolvendo corretamente o id.
  const origensPorId = {}; DB.origensTodas.forEach(o=>{ origensPorId[o.id] = o.nome; });
  const motivosPorId = {}; DB.motivosPerdaTodas.forEach(m=>{ motivosPorId[m.id] = m.nome; });
  const profilesPorId = {}; (profilesRows||[]).forEach(p=>{ profilesPorId[p.id] = p.nome; });
  const origensPorNome = {}; Object.entries(origensPorId).forEach(([id,nome])=>{ origensPorNome[nome]=id; });
  const motivosPorNome = {}; Object.entries(motivosPorId).forEach(([id,nome])=>{ motivosPorNome[nome]=id; });
  const responsaveisPorNome = {}; Object.entries(profilesPorId).forEach(([id,nome])=>{ responsaveisPorNome[nome]=id; });

  // Preserva procedimentosPorPaciente (não muda numa atualização só de
  // configurações) e sobrescreve só os mapas desta função.
  DB._refsSupabase = {
    ...(DB._refsSupabase||{}),
    origensPorId, motivosPorId, profilesPorId,
    origensPorNome, motivosPorNome, responsaveisPorNome,
  };
}

// [Config admin] Reconsulta só as 4 tabelas auxiliares (sem tocar em
// pacientes) depois de uma ação administrativa em Configurações — evita um
// reload completo da página e mantém os dados em memória sincronizados com
// o banco. Erros aqui não derrubam a tela: ficam só no console + um toast.
async function recarregarListasConfigSupabase(){
  const sb = window.moriSupabase;
  const [
    { data: procRows, error: errProc },
    { data: origensRows, error: errOrig },
    { data: motivosRows, error: errMot },
    { data: profilesRows, error: errProf },
    { data: tiposRecorrenciaRows, error: errTiposRec },
  ] = await Promise.all([
    sb.from('procedimentos').select('id, nome, valor_medio, ativo'),
    sb.from('origens_lead').select('id, nome, ativo'),
    sb.from('motivos_perda').select('id, nome, ativo'),
    sb.from('profiles').select('id, nome, cargo, role, ativo, auth_user_id'),
    sb.from('tipos_recorrencia').select('id, nome, frequencia_sugerida_dias, ativo'),
  ]);
  const erro = errProc || errOrig || errMot || errProf || errTiposRec;
  if(erro){
    console.error('Falha ao recarregar listas de Configurações.', erro);
    toast('Não foi possível atualizar as listas agora. Tente recarregar a página.');
    return;
  }
  aplicarListasAuxiliaresConfig(procRows, origensRows, motivosRows, profilesRows, tiposRecorrenciaRows);
}

async function carregarDadosSupabase(perfil){
  const sb = window.moriSupabase;
  // [Supabase] Nenhuma consulta abaixo filtra por clinica_id manualmente —
  // o isolamento por clínica é feito inteiramente pela RLS do banco.
  const [
    { data: pacientesRows, error: errPac },
    { data: ppRows, error: errPP },
    { data: procRows, error: errProc },
    { data: origensRows, error: errOrig },
    { data: motivosRows, error: errMot },
    { data: profilesRows, error: errProf },
    { data: acoesRows, error: errAcoes },
    { data: clinicaRows, error: errClinica },
    { data: tiposRecorrenciaRows, error: errTiposRec },
    { data: ciclosRecorrenciaRows, error: errCiclosRec },
    { data: retornosRecorrenciaRows, error: errRetornosRec },
  ] = await Promise.all([
    sb.from('pacientes_com_status').select('*'),
    sb.from('paciente_procedimentos').select('paciente_id, procedimento_id'),
    sb.from('procedimentos').select('id, nome, valor_medio, ativo'),
    sb.from('origens_lead').select('id, nome, ativo'),
    sb.from('motivos_perda').select('id, nome, ativo'),
    sb.from('profiles').select('id, nome, cargo, role, ativo, auth_user_id'),
    // [Fase A] cache de ações comerciais já concluídas — ver acaoComercialConcluida().
    sb.from('acoes_comerciais').select('paciente_id, tipo, data_elegivel, data_conclusao, observacao'),
    // [Corte operacional / Recorrência] data_inicio_acoes_comerciais e
    // timezone — RLS já restringe à própria clínica (ver_minha_clinica),
    // por isso sempre 0 ou 1 linha.
    sb.from('clinicas').select('id, data_inicio_acoes_comerciais, timezone'),
    // [Recorrência] lista configurável de tipos + ciclos + histórico de
    // retornos, todos já escopados pela RLS da clínica do usuário.
    sb.from('tipos_recorrencia').select('id, nome, frequencia_sugerida_dias, ativo'),
    sb.from('ciclos_recorrencia').select('*'),
    sb.from('retornos_recorrencia').select('*'),
  ]);

  const erro = errPac || errPP || errProc || errOrig || errMot || errProf || errAcoes || errClinica || errTiposRec || errCiclosRec || errRetornosRec;
  if(erro) throw erro;

  // [Supabase] Monta o DB da sessão a partir do estado padrão local — mantém
  // funcionários/WhatsApp/Pós-Vendas/Indicações/tema exatamente como já
  // funcionam hoje (fora do escopo desta rodada) — e substitui SOMENTE a
  // lista de pacientes pelos dados reais vindos do banco, já filtrados
  // pela RLS da clínica do usuário autenticado.
  DB = buildInitialState();
  // [CRUD] id/clinica_id/role do profile autenticado (nunca hardcoded —
  // vêm sempre da consulta real feita em carregarAposLogin). Usados pelas
  // RPCs apenas indiretamente: o próprio banco deriva clinica_id/created_by/
  // updated_by de auth.uid(), mas o frontend precisa saber "quem sou eu"
  // para decisões de interface (ex: visibilidade por role, botões de
  // Configurações).
  DB.usuarioAtual = { id: perfil.id, clinicaId: perfil.clinica_id, role: perfil.role || null, nome: perfil.nome, cargo: perfil.cargo || '' };
  DB._refsSupabase = {};

  // [Limpeza Supabase] Origens/motivos/responsáveis/procedimentos/equipe
  // passam a vir do banco real — substitui as listas de exemplo
  // (SEED_ORIGENS, SEED_MOTIVOS_PERDA, ['Mariana','Natalia','Julia'],
  // SEED_PROCEDIMENTOS) que o buildInitialState() acima usou como padrão.
  aplicarListasAuxiliaresConfig(procRows, origensRows, motivosRows, profilesRows, tiposRecorrenciaRows);

  const procedimentosPorId = {};
  (procRows||[]).forEach(p=>{ procedimentosPorId[p.id] = p.nome; });
  const procedimentosPorPaciente = {};
  (ppRows||[]).forEach(v=>{
    const nome = procedimentosPorId[v.procedimento_id];
    if(!nome) return;
    if(!procedimentosPorPaciente[v.paciente_id]) procedimentosPorPaciente[v.paciente_id] = [];
    procedimentosPorPaciente[v.paciente_id].push(nome);
  });
  // [CRUD] Guarda os mapas id<->nome da carga inicial para reuso no
  // salvamento (cadastro/edição) sem precisar resolver por nome contra o
  // Supabase de novo — e para reaproveitar o mesmo mapPacienteSupabaseParaCRM
  // no retorno das RPCs (ver salvarPacienteSupabase).
  DB._refsSupabase.procedimentosPorPaciente = procedimentosPorPaciente;

  const pacientesMapeados = (pacientesRows||[]).map(row=>mapPacienteSupabaseParaCRM(row, DB._refsSupabase));
  DB.pacientes = pacientesMapeados;
  // Indicações não são carregadas do Supabase nesta rodada (fora do escopo
  // definido para esta etapa) — mantidas vazias para não exibir dado
  // desatualizado como se fosse real.
  DB.indicacoes = [];
  // [Fase A] cache de ações comerciais concluídas (Resgate/Follow-up/
  // Pós-Consulta) — ver acaoComercialConcluida()/recarregarAcoesComerciaisSupabase().
  DB._acoesComerciaisSupabase = acoesRows || [];
  // [Corte operacional] null = clínica ainda sem corte configurado (sem
  // alteração de comportamento — mesma coisa que antes desta correção).
  DB.dataInicioAcoesComerciais = (clinicaRows && clinicaRows[0] && clinicaRows[0].data_inicio_acoes_comerciais) || null;
  // [Recorrência] fuso horário da clínica — usado SOMENTE por
  // hojeCivilClinica()/classificarCicloRecorrencia(). Nunca afeta hojeISO()
  // nem Resgate/Pós-Consulta/Agenda/Dashboard. Default local mantém a Mori
  // funcionando mesmo antes da coluna existir numa clínica futura.
  DB.clinicaTimezone = (clinicaRows && clinicaRows[0] && clinicaRows[0].timezone) || 'America/Sao_Paulo';
  // [Recorrência] mapCicloSupabaseParaCRM()/mapRetornoSupabaseParaCRM() já
  // fazem o join client-side com DB.pacientes/DB.tiposRecorrenciaTodos/
  // DB.equipeSupabase — todos já preenchidos nesta altura da função.
  DB.ciclosRecorrencia = (ciclosRecorrenciaRows||[]).map(mapCicloSupabaseParaCRM);
  DB._retornosRecorrenciaSupabase = (retornosRecorrenciaRows||[]).map(mapRetornoSupabaseParaCRM);

  render();
  bindRouteEvents();
  toast(`Conectado ao Supabase — ${pacientesMapeados.length} pacientes carregados da clínica.`);
}

// [Fase A] Reconsulta só acoes_comerciais depois de concluir uma ação
// (Resgate/Follow-up/Pós-Consulta) — evita recarregar os 79 pacientes só
// para atualizar esse cache. Chamada por concluirAcaoComercial() após a
// RPC ter sucesso.
async function recarregarAcoesComerciaisSupabase(){
  const { data, error } = await window.moriSupabase
    .from('acoes_comerciais')
    .select('paciente_id, tipo, data_elegivel, data_conclusao, observacao');
  if(error){
    console.error('Falha ao recarregar ações comerciais.', error);
    return;
  }
  DB._acoesComerciaisSupabase = data || [];
}

async function iniciarSupabase(){
  const { data } = await window.moriSupabase.auth.getSession();
  if(data && data.session){
    await carregarAposLogin();
  } else {
    renderGateSupabase({tipo:'login', erro:null, carregando:false});
  }
}

if(MODO_SUPABASE){
  iniciarSupabase().catch(e=>{
    console.error('Falha ao iniciar sessão Supabase.', e);
    renderGateSupabase({tipo:'login', erro:'Não foi possível conectar ao Supabase. Tente novamente.', carregando:false});
  });
} else {
  loadState();
  render();
  // [V2 — CORREÇÃO] Avisa uma única vez, no boot, se um estado salvo nesta
  // chave foi descartado por não ser deste CRM (ver loadState()).
  if(AVISO_ESTADO_IGNORADO){
    toast('Um estado salvo neste navegador não era desta clínica (Mori) e foi ignorado com segurança — nada foi apagado.');
  }
}
</script>
