<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Comercial — Clínica que Converte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CRM Comercial — Clínica que Converte
   Design system: tokens "ink" (petróleo/marinho) + "gold" (dourado)
   Tipografia: Fraunces (títulos) / Manrope (corpo)
   ============================================================ */
:root{
  --ink-950:#081b20;
  --ink-900:#0F3B44;
  --ink-800:#154953;
  --ink-700:#1d5c68;
  --ink-100:#e4eef0;
  --gold-500:#C9A227;
  --gold-600:#a9861c;
  --gold-100:#fbf3d9;
  --paper:#ffffff;
  --bg:#f6f4ee;
  --line:#e4e0d3;
  --text:#16232a;
  --text-muted:#5c6c70;
  --danger:#b23a3a;
  --danger-bg:#fbe9e9;
  --success:#2f7d5a;
  --success-bg:#e7f3ec;
  --warn:#c9861f;
  --warn-bg:#fbf1de;
  --info:#3a6fb2;
  --info-bg:#eaf1fb;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 8px 24px rgba(15,59,68,.08);
  --shadow-lg:0 16px 40px rgba(15,59,68,.16);
  --sidebar-w:250px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#122127;
    --bg:#0c1a1f;
    --line:#22343a;
    --text:#eef3f2;
    --text-muted:#9fb0b3;
    --ink-100:#16323a;
    --shadow:0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    --danger-bg:#3a2222;
    --success-bg:#173427;
    --warn-bg:#3a2f16;
    --info-bg:#1b2c3d;
  }
}
:root[data-theme="dark"]{
  --paper:#122127;
  --bg:#0c1a1f;
  --line:#22343a;
  --text:#eef3f2;
  --text-muted:#9fb0b3;
  --ink-100:#16323a;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  --danger-bg:#3a2222;
  --success-bg:#173427;
  --warn-bg:#3a2f16;
  --info-bg:#1b2c3d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Manrope",-apple-system,Segoe UI,Arial,sans-serif;
  font-size:14.5px;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:"Fraunces","Georgia",serif;font-weight:600;margin:0 0 4px;color:var(--text);}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ---------- layout ---------- */
#app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg,var(--ink-950),var(--ink-900));
  color:#eaf3f3;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;}
.brand-badge{
  width:38px;height:38px;border-radius:9px;background:var(--gold-500);
  color:var(--ink-950);font-family:"Fraunces",serif;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand-text{line-height:1.2;}
.brand-text b{display:block;font-family:"Fraunces",serif;font-size:15px;color:#fff;}
.brand-text span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9fc3c9;}

.clinic-pill{
  margin:2px 16px 14px;padding:9px 12px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
}
.clinic-pill .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8fb3b8;}
.clinic-pill .v{font-size:13.5px;font-weight:700;color:#fff;font-family:"Fraunces",serif;}

nav.nav{padding:6px 10px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:#cfe3e5;cursor:pointer;font-size:13.6px;font-weight:600;margin-bottom:2px;
  border:1px solid transparent;user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(201,162,39,.16);color:#fff;border-color:rgba(201,162,39,.35);}
.nav-item .ic{width:18px;text-align:center;opacity:.9;}

.sidebar-foot{padding:14px 18px 18px;font-size:11.5px;color:#7fa2a7;border-top:1px solid rgba(255,255,255,.08);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:20px;}
.topbar .sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.content{padding:22px 26px 60px;max-width:1320px;width:100%;margin:0 auto;}

/* ---------- generic components ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.card + .card{margin-top:16px;}
.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1080px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  border:1px solid var(--line);background:var(--paper);color:var(--text);font-weight:700;
  font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-700);}
.btn.primary{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
.btn.primary:hover{background:var(--ink-800);}
.btn.gold{background:var(--gold-500);border-color:var(--gold-500);color:#28210a;}
.btn.gold:hover{background:var(--gold-600);}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn.danger:hover{background:var(--danger-bg);}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--ink-100);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--ink-100);color:var(--ink-900);font-size:11.5px;font-weight:700;white-space:nowrap;}
:root[data-theme="dark"] .pill, @media (prefers-color-scheme:dark){.pill{color:#dff0f2;}}
.badge-status{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap;}
.tag-urg-atrasado{background:var(--danger-bg);color:var(--danger);}
.tag-urg-proximo{background:var(--warn-bg);color:var(--warn);}
.tag-urg-em-dia{background:var(--success-bg);color:var(--success);}

input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--text);font-family:inherit;font-size:13.5px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-500);outline-offset:1px;}
label.field{display:block;margin-bottom:12px;}
label.field .lbl{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.check-row{display:flex;align-items:center;gap:7px;font-size:13px;padding:4px 0;}
.check-row input{width:auto;}
.chips-check{display:flex;flex-wrap:wrap;gap:8px;}
.chip-check{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;user-select:none;font-weight:600;}
.chip-check input{display:none;}
.chip-check.on{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}

table{width:100%;border-collapse:collapse;font-size:13.3px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--ink-100);}
.table-wrap{overflow-x:auto;}

.empty{color:var(--text-muted);text-align:center;padding:30px 10px;font-size:13.5px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-title h2{font-size:19px;}
.muted{color:var(--text-muted);}
.small{font-size:12px;}
.hr{height:1px;background:var(--line);margin:16px 0;border:none;}

/* stat tile */
.stat-tile{padding:16px 18px;}
.stat-tile .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;}
.stat-tile .val{font-family:"Fraunces",serif;font-size:26px;font-weight:700;margin-top:6px;color:var(--ink-900);}
:root[data-theme="dark"] .stat-tile .val{color:var(--gold-500);}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat-tile .val{color:var(--gold-500);}}

/* kanban */
.kanban-wrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;}
.kanban-col{flex:0 0 268px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 210px);}
.kanban-col-head{padding:12px 14px;border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:#fff;}
.kanban-col-body{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:9px;}
.kcard{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;box-shadow:0 2px 6px rgba(15,59,68,.06);}
.kcard:hover{border-color:var(--ink-700);}
.kcard .nm{font-weight:800;font-size:13.3px;margin-bottom:4px;}
.kcard .meta{font-size:11.5px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.kcard .obs{margin-top:7px;font-size:11.6px;background:var(--warn-bg);color:#6b4d0f;padding:6px 8px;border-radius:8px;}
:root[data-theme="dark"] .kcard .obs, @media(prefers-color-scheme:dark){.kcard .obs{color:#f0d99a;}}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(8,20,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
.modal{background:var(--paper);border-radius:16px;max-width:760px;width:100%;box-shadow:var(--shadow-lg);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal-close{cursor:pointer;font-size:20px;color:var(--text-muted);border:none;background:none;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--ink-950);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:99;font-size:13px;font-weight:600;}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filters-bar select,.filters-bar input{width:auto;min-width:150px;}

.bars{display:flex;align-items:flex-end;gap:14px;padding:10px 6px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;}
.bar-box{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:150px;width:100%;}
.bar-fill{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--ink-100);border:1px solid var(--ink-700);border-bottom:none;}
.bar-col .lbl{font-size:10.6px;color:var(--text-muted);margin-top:8px;text-align:center;}
.bar-col .val{font-size:10.6px;font-weight:800;color:var(--text);margin-bottom:4px;}

.ethics-box{background:var(--info-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12.6px;color:var(--text);}
.ethics-box b{color:var(--info);}

.list-edit-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);}
.list-edit-row:last-child{border-bottom:none;}
.list-edit-row .grow{flex:1;}

.chk-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.chk-item:last-child{border-bottom:none;}
</style>

// Ordem fixa das etapas do funil (nome exatamente como a clínica já usa).
// Cor é customizável em Configurações; a ORDEM e o NOME não, pois vêm da
// regra automática de cálculo de status (ver calcStatus()).
const ETAPAS_PADRAO = [
  {id:'novo',        nome:'Novo Paciente',         cor:'#5c6c70'},

  {id:'pendente',    nome:'Pendente',              cor:'#c9861f'},
  {id:'nao_precisa', nome:'Não Precisa no Momento',cor:'#9c8a4f'},
  {id:'perdido',     nome:'Perdido',                cor:'#8a3a3a'},
];

const ESTAGIOS_ABERTOS = ['Novo Paciente','Consulta Marcada','Não Compareceu','Compareceu','Plano de Tratamento','Pendente'];
const ESTAGIOS_TERMINAIS = ['Fechado (Total)','Fechado (Parcial)','Não Precisa no Momento','Perdido'];

// Regra automática de status — reproduz EXATAMENTE a fórmula validada em uso
// real na planilha da clínica (aba Pacientes, coluna "Status Atual"):
//
// =IF(Fechou="Sim","Fechado (Total)",
//   IF(Fechou="Parcial","Fechado (Parcial)",
//   IF(Fechou="Não","Perdido",
//   IF(Fechou="Pendente","Pendente",
//   IF(Fechou="Não precisa no momento","Não Precisa no Momento",
//   IF(Plano="Sim","Plano de Tratamento",
//   IF(Compareceu="Não","Não Compareceu",
//   IF(Compareceu="Sim","Compareceu",
//   IF(MarcouConsulta="Não","Perdido",
//   IF(MarcouConsulta="Sim","Consulta Marcada",
//   IF(Nome="","","Novo Paciente")))))))))))
function calcStatus(p){
  const f = p.fechouTratamento, pl = p.planoTratamento, c = p.compareceu, m = p.marcouConsulta;
  if (f === 'Sim') return 'Fechado (Total)';
  if (f === 'Parcial') return 'Fechado (Parcial)';
  if (f === 'Não') return 'Perdido';
  if (f === 'Pendente') return 'Pendente';
  if (f === 'Não precisa no momento') return 'Não Precisa no Momento';
  if (pl === 'Sim') return 'Plano de Tratamento';
  if (c === 'Não') return 'Não Compareceu';
  if (c === 'Sim') return 'Compareceu';
  if (m === 'Não') return 'Perdido';
  if (m === 'Sim') return 'Consulta Marcada';
  if (!p.nome) return '';
  return 'Novo Paciente';
}

let DB = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DB = JSON.parse(raw); }
    else { DB = buildInitialState(); saveState(); }
  }catch(e){
    console.error('Falha ao carregar estado, recriando seed.', e);
    DB = buildInitialState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('Falha ao salvar estado (localStorage cheio ou indisponível).', e); toast('Não foi possível salvar automaticamente. Faça um backup (Configurações → Backup).'); }
}

function fmtMoeda(v){
  if(v===null||v===undefined||v==='') return '—';
  return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtData(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function diasEntre(isoA,isoB){
  if(!isoA||!isoB) return null;
  const a=new Date(isoA+'T00:00:00'), b=new Date(isoB+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function monthLabel(key){
  const [y,m]=key.split('-');
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return meses[parseInt(m,10)-1]+'/'+y;
}
function toast(msg){
  const root=document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  setTimeout(()=>{ root.innerHTML=''; }, 3200);
}
function etapaCor(nome){
  const e = DB.etapasFunil.find(e=>e.nome===nome);
  return e ? e.cor : '#5c6c70';
}

let filtroPacientes = {origem:'',procedimento:'',responsavel:'',status:'',busca:''};

function pacientesFiltrados(){
  return DB.pacientes.filter(p=>{
    const status = calcStatus(p);
    if(filtroPacientes.origem && p.origem!==filtroPacientes.origem) return false;
    if(filtroPacientes.responsavel && p.responsavel!==filtroPacientes.responsavel) return false;
    if(filtroPacientes.status && status!==filtroPacientes.status) return false;
    if(filtroPacientes.procedimento && !(p.procedimentos||[]).includes(filtroPacientes.procedimento)) return false;
    if(filtroPacientes.busca){
      const q = filtroPacientes.busca.toLowerCase();
      if(!p.nome.toLowerCase().includes(q) && !(p.telefone||'').includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.dataContato||'').localeCompare(a.dataContato||''));
}

let dashboardMesSelecionado = null; // definido em renderDashboard() na 1ª vez

function mesesDisponiveis(){
  // Março/2026 em diante, como na planilha original; estende automaticamente
  // até o mês atual se os dados forem além.
  const inicio = new Date(2026,2,1); // Março/2026
  const hoje = new Date();
  const maisRecente = DB.pacientes.reduce((acc,p)=>{
    const d = p.dataContato && new Date(p.dataContato+'T00:00:00');
    return d && d>acc ? d : acc;
  }, hoje);
  const fim = maisRecente>hoje?maisRecente:hoje;
  const meses = [];
  let cursor = new Date(inicio);
  while(cursor<=fim){
    meses.push(cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0'));
    cursor.setMonth(cursor.getMonth()+1);
  }
  return meses;
}

function aggregateMonth(key){
  const novos = DB.pacientes.filter(p=>monthKey(p.dataContato)===key);
  const fechadosMes = DB.pacientes.filter(p=>monthKey(p.dataFechamento)===key && (p.fechouTratamento==='Sim'||p.fechouTratamento==='Parcial'));
  const valorTotal = fechadosMes.reduce((s,p)=>s+(p.valorFechado||0),0);
  const taxa = novos.length? fechadosMes.length/novos.length : 0;
  const ticket = fechadosMes.length? valorTotal/fechadosMes.length : 0;
  return {novos:novos.length, fechados:fechadosMes.length, taxa, valorTotal, ticket};
}

function funilTotais(mesFiltro){
  const base = DB.pacientes;
  const novos = base.length;
  const agendados = base.filter(p=>p.marcouConsulta==='Sim').length;
  const compareceram = base.filter(p=>p.compareceu==='Sim').length;
  const fechados = base.filter(p=>{ const s=calcStatus(p); return s==='Fechado (Total)'||s==='Fechado (Parcial)'; }).length;
  let noMes = {novos:0,agendados:0,compareceram:0,fechados:0};
  if(mesFiltro){
    noMes.novos = base.filter(p=>monthKey(p.dataContato)===mesFiltro).length;
    noMes.agendados = base.filter(p=>p.marcouConsulta==='Sim'&&monthKey(p.dataConsulta)===mesFiltro).length;
    noMes.compareceram = base.filter(p=>p.compareceu==='Sim'&&monthKey(p.dataConsulta)===mesFiltro).length;
    noMes.fechados = base.filter(p=>{ const s=calcStatus(p); return (s==='Fechado (Total)'||s==='Fechado (Parcial)')&&monthKey(p.dataFechamento)===mesFiltro; }).length;
  }
  return {novos,agendados,compareceram,fechados,noMes};
}

/* ============================================================
   9) AGENDA — urgência (heurística: ver Contexto/README sobre limitação)
   ============================================================ */
function calcUrgencia(p){
  const status = calcStatus(p);
  const hoje = hojeISO();
  let dias = null, texto = '';
  if(status==='Novo Paciente'){
    dias = diasEntre(p.dataContato, hoje);
    texto = 'Fazer 1º contato / agendar consulta';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=3?'atrasado':(dias>=1?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Consulta Marcada'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = dias!==null && dias>0 ? 'Registrar resultado da consulta (compareceu?)' : 'Confirmar presença na consulta';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>0?'atrasado':(dias>=-1?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Não Compareceu'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = 'Tentar reagendar consulta';
    return {nivel:'atrasado', texto, dias};
  }
  if(status==='Compareceu'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = 'Follow-up: apresentar plano/orçamento';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=5?'atrasado':(dias>=2?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Plano de Tratamento'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = 'Follow-up: fechar tratamento';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=5?'atrasado':(dias>=2?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Pendente'){
    const ref = p.dataFechamento || p.dataConsulta || p.dataContato;
    dias = diasEntre(ref, hoje);
    texto = 'Retomar contato — decisão pendente'+(p.observacoes?`: ${p.observacoes}`:'');
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=5?'atrasado':(dias>=2?'proximo':'em-dia'), texto, dias};
  }
  return null;
}

function renderAgenda(){
  const abertos = DB.pacientes.filter(p=>ESTAGIOS_ABERTOS.includes(calcStatus(p)));
  const itens = abertos.map(p=>({p, u:calcUrgencia(p)})).filter(x=>x.u);
  const ordem = {atrasado:0, proximo:1, 'em-dia':2};
  itens.sort((a,b)=> (ordem[a.u.nivel]-ordem[b.u.nivel]) || ((b.u.dias??0)-(a.u.dias??0)) );
  const nivelLabel = {atrasado:'Atrasado', proximo:'Próximo', 'em-dia':'Em dia'};
  const nivelClasse = {atrasado:'tag-urg-atrasado', proximo:'tag-urg-proximo', 'em-dia':'tag-urg-em-dia'};
  return `
  <div class="card">
    <div class="section-title"><h2 style="font-size:16px;margin:0;">Próximas ações (${itens.length})</h2>
      <span class="muted small">Ordenado por urgência: atrasado → próximo → em dia</span>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Urgência</th><th>Paciente</th><th>Status</th><th>Ação sugerida</th><th>Responsável</th></tr></thead>
      <tbody>
      ${itens.length? itens.map(({p,u})=>`
        <tr class="clickable" data-open="${p.id}">
          <td><span class="badge-status ${nivelClasse[u.nivel]}">${nivelLabel[u.nivel]}</span></td>
          <td><b>${escapeHtml(p.nome)}</b></td>
          <td><span class="badge-status" style="background:${etapaCor(calcStatus(p))}22;color:${etapaCor(calcStatus(p))}">${escapeHtml(calcStatus(p))}</span></td>
          <td>${escapeHtml(u.texto)}</td>
          <td>${escapeHtml(p.responsavel||'—')}</td>
        </tr>`).join('') : `<tr><td colspan="5" class="empty">Nenhuma ação pendente — tudo em dia.</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>`;
}

  document.querySelectorAll('[data-del-list]').forEach(el=>{
    el.addEventListener('click', ()=>{
      DB[el.dataset.delList ?? el.getAttribute('data-del-list')].splice(parseInt(el.dataset.idx,10),1);
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-add-list]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.addList;
      const v = prompt('Novo valor:');
      if(v){ DB[key].push(v.trim()); saveState(); render(); }
    });
  });
  document.querySelectorAll('[data-proc-valor]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const proc = DB.procedimentos.find(p=>p.id===el.dataset.procValor);
      if(proc){ proc.valorMedio = parseFloat(el.value)||0; saveState(); toast('Valor médio atualizado.'); }
    });
  });
  document.querySelectorAll('[data-del-proc]').forEach(el=>{
    el.addEventListener('click', ()=>{
      DB.procedimentos = DB.procedimentos.filter(p=>p.id!==el.dataset.delProc);
      saveState(); render();
    });
  });
  const addProc = document.querySelector('[data-action="add-proc"]');
  if(addProc) addProc.addEventListener('click', ()=>{
    const nome = prompt('Nome do novo procedimento:');
    if(nome){ DB.procedimentos.push({id:uid('proc'), nome:nome.trim(), valorMedio:0}); saveState(); render(); }
  });
  document.querySelectorAll('[data-etapa-cor]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const et = DB.etapasFunil.find(e=>e.id===el.dataset.etapaCor);
      if(et){ et.cor = el.value; saveState(); }
    });
  });
  const expJson = document.querySelector('[data-action="export-json"]');
  if(expJson) expJson.addEventListener('click', exportBackupJSON);
  const expCsv = document.querySelector('[data-action="export-csv"]');
  if(expCsv) expCsv.addEventListener('click', exportPacientesCSV);
  const impJson = document.getElementById('import-json');
  if(impJson) impJson.addEventListener('change', importBackupJSON);
}

function exportBackupJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-crm-${DB.clinica.nome.replace(/\s+/g,'-').toLowerCase()}-${hojeISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup JSON exportado.');
}
function importBackupJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const novo = JSON.parse(ev.target.result);
      if(!novo.pacientes) throw new Error('Arquivo não parece um backup válido.');
      if(confirm('Importar este backup vai substituir todos os dados atuais. Continuar?')){
        DB = novo; saveState(); render(); toast('Backup importado com sucesso.');
      }
    }catch(err){ alert('Erro ao importar backup: '+err.message); }
  };
  reader.readAsText(file);
}
function exportPacientesCSV(){
  const headers = ['Nome','Telefone','Email','Origem','Procedimentos','Responsável','Data 1º Contato','Marcou Consulta','Data Consulta','Compareceu','Fez Radiografia','Plano de Tratamento','Valor Orçamento','Fechou Tratamento','Valor Fechado','Data Fechamento','Motivo da Perda','Status Atual','Observações'];
  const rows = DB.pacientes.map(p=>[
    p.nome,p.telefone,p.email,p.origem,(p.procedimentos||[]).join('; '),p.responsavel,
    fmtData(p.dataContato),p.marcouConsulta,fmtData(p.dataConsulta),p.compareceu,p.fezRadiografia,
    p.planoTratamento,p.valorOrcamento??'',p.fechouTratamento,p.valorFechado??'',fmtData(p.dataFechamento),
    p.motivoPerda,calcStatus(p),p.observacoes
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`pacientes-${DB.clinica.nome.replace(/\s+/g,'-').toLowerCase()}-${hojeISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV de pacientes exportado.');
}

/* ============================================================
   12) bind por rota + boot
   ============================================================ */
function bindRouteEvents(){
  if(ROUTE==='pacientes') bindPacientesEvents();
  if(ROUTE==='kanban') bindKanbanEvents();
  if(ROUTE==='indicacoes') bindIndicacoesEvents();
  if(ROUTE==='dashboard') bindDashboardEvents();
  if(ROUTE==='assistente') bindAssistenteEvents();
  if(ROUTE==='config') bindConfigEvents();
}

loadState();
render();
</script>
