<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Comercial — Clínica que Converte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CRM Comercial — Clínica que Converte
   Design system: tokens "ink" (petróleo/marinho) + "gold" (dourado)
   Tipografia: Fraunces (títulos) / Manrope (corpo)
   ============================================================ */
:root{
  --ink-950:#081b20;
  --ink-900:#0F3B44;
  --ink-800:#154953;
  --ink-700:#1d5c68;
  --ink-100:#e4eef0;
  --gold-500:#C9A227;
  --gold-600:#a9861c;
  --gold-100:#fbf3d9;
  --paper:#ffffff;
  --bg:#f6f4ee;
  --line:#e4e0d3;
  --text:#16232a;
  --text-muted:#5c6c70;
  --danger:#b23a3a;
  --danger-bg:#fbe9e9;
  --success:#2f7d5a;
  --success-bg:#e7f3ec;
  --warn:#c9861f;
  --warn-bg:#fbf1de;
  --info:#3a6fb2;
  --info-bg:#eaf1fb;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 8px 24px rgba(15,59,68,.08);
  --shadow-lg:0 16px 40px rgba(15,59,68,.16);
  --sidebar-w:250px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#122127;
    --bg:#0c1a1f;
    --line:#22343a;
    --text:#eef3f2;
    --text-muted:#9fb0b3;
    --ink-100:#16323a;
    --shadow:0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    --danger-bg:#3a2222;
    --success-bg:#173427;
    --warn-bg:#3a2f16;
    --info-bg:#1b2c3d;
  }
}
:root[data-theme="dark"]{
  --paper:#122127;
  --bg:#0c1a1f;
  --line:#22343a;
  --text:#eef3f2;
  --text-muted:#9fb0b3;
  --ink-100:#16323a;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  --danger-bg:#3a2222;
  --success-bg:#173427;
  --warn-bg:#3a2f16;
  --info-bg:#1b2c3d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Manrope",-apple-system,Segoe UI,Arial,sans-serif;
  font-size:14.5px;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:"Fraunces","Georgia",serif;font-weight:600;margin:0 0 4px;color:var(--text);}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ---------- layout ---------- */
#app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg,var(--ink-950),var(--ink-900));
  color:#eaf3f3;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;}
.brand-badge{
  width:38px;height:38px;border-radius:9px;background:var(--gold-500);
  color:var(--ink-950);font-family:"Fraunces",serif;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand-text{line-height:1.2;}
.brand-text b{display:block;font-family:"Fraunces",serif;font-size:15px;color:#fff;}
.brand-text span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9fc3c9;}

.clinic-pill{
  margin:2px 16px 14px;padding:9px 12px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
}
.clinic-pill .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8fb3b8;}
.clinic-pill .v{font-size:13.5px;font-weight:700;color:#fff;font-family:"Fraunces",serif;}

nav.nav{padding:6px 10px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:#cfe3e5;cursor:pointer;font-size:13.6px;font-weight:600;margin-bottom:2px;
  border:1px solid transparent;user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(201,162,39,.16);color:#fff;border-color:rgba(201,162,39,.35);}
.nav-item .ic{width:18px;text-align:center;opacity:.9;}

.sidebar-foot{padding:14px 18px 18px;font-size:11.5px;color:#7fa2a7;border-top:1px solid rgba(255,255,255,.08);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:20px;}
.topbar .sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.content{padding:22px 26px 60px;max-width:1320px;width:100%;margin:0 auto;}

/* ---------- generic components ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.card + .card{margin-top:16px;}
.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1080px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  border:1px solid var(--line);background:var(--paper);color:var(--text);font-weight:700;
  font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-700);}
.btn.primary{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
.btn.primary:hover{background:var(--ink-800);}
.btn.gold{background:var(--gold-500);border-color:var(--gold-500);color:#28210a;}
.btn.gold:hover{background:var(--gold-600);}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn.danger:hover{background:var(--danger-bg);}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--ink-100);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--ink-100);color:var(--ink-900);font-size:11.5px;font-weight:700;white-space:nowrap;}
:root[data-theme="dark"] .pill, @media (prefers-color-scheme:dark){.pill{color:#dff0f2;}}
.badge-status{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap;}
.tag-urg-atrasado{background:var(--danger-bg);color:var(--danger);}
.tag-urg-proximo{background:var(--warn-bg);color:var(--warn);}
.tag-urg-em-dia{background:var(--success-bg);color:var(--success);}

input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--text);font-family:inherit;font-size:13.5px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-500);outline-offset:1px;}
label.field{display:block;margin-bottom:12px;}
label.field .lbl{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.check-row{display:flex;align-items:center;gap:7px;font-size:13px;padding:4px 0;}
.check-row input{width:auto;}
.chips-check{display:flex;flex-wrap:wrap;gap:8px;}
.chip-check{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;user-select:none;font-weight:600;}
.chip-check input{display:none;}
.chip-check.on{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}

table{width:100%;border-collapse:collapse;font-size:13.3px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--ink-100);}
.table-wrap{overflow-x:auto;}

.empty{color:var(--text-muted);text-align:center;padding:30px 10px;font-size:13.5px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-title h2{font-size:19px;}
.muted{color:var(--text-muted);}
.small{font-size:12px;}
.hr{height:1px;background:var(--line);margin:16px 0;border:none;}

/* stat tile */
.stat-tile{padding:16px 18px;}
.stat-tile .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;}
.stat-tile .val{font-family:"Fraunces",serif;font-size:26px;font-weight:700;margin-top:6px;color:var(--ink-900);}
:root[data-theme="dark"] .stat-tile .val{color:var(--gold-500);}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat-tile .val{color:var(--gold-500);}}

/* kanban */
.kanban-wrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;}
.kanban-col{flex:0 0 268px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 210px);}
.kanban-col-head{padding:12px 14px;border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:#fff;}
.kanban-col-body{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:9px;}
.kcard{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;box-shadow:0 2px 6px rgba(15,59,68,.06);}
.kcard:hover{border-color:var(--ink-700);}
.kcard .nm{font-weight:800;font-size:13.3px;margin-bottom:4px;}
.kcard .meta{font-size:11.5px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.kcard .obs{margin-top:7px;font-size:11.6px;background:var(--warn-bg);color:#6b4d0f;padding:6px 8px;border-radius:8px;}
:root[data-theme="dark"] .kcard .obs, @media(prefers-color-scheme:dark){.kcard .obs{color:#f0d99a;}}
.kcard-valor{font-size:13px;font-weight:700;color:var(--text);margin-top:4px;}
.kcard-acoes{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}

/* [Recorrência] indicadores clicáveis (filtros) */
.indicadores-recorrencia{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.indicador-recorrencia{flex:1 1 150px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:border-color .15s;}
.indicador-recorrencia:hover{border-color:var(--ink-700);}
.indicador-recorrencia.ativo{border-color:var(--gold-500);background:var(--gold-100);}
:root[data-theme="dark"] .indicador-recorrencia.ativo, @media(prefers-color-scheme:dark){.indicador-recorrencia.ativo{background:rgba(201,162,39,.14);}}
.indicador-recorrencia .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;}
.indicador-recorrencia .val{font-family:"Fraunces",serif;font-size:24px;font-weight:700;margin-top:4px;color:var(--ink-900);}
:root[data-theme="dark"] .indicador-recorrencia .val, @media(prefers-color-scheme:dark){.indicador-recorrencia .val{color:var(--gold-500);}}

/* [Recorrência] cards horizontais compactos */
.recorrencia-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--paper);box-shadow:0 2px 6px rgba(15,59,68,.06);}
.recorrencia-card + .recorrencia-card{margin-top:9px;}
.recorrencia-card.destaque{border-color:var(--gold-500);box-shadow:0 0 0 2px var(--gold-100);}
.recorrencia-card .info{min-width:0;}
.recorrencia-card .nm{font-weight:800;font-size:13.6px;}
.recorrencia-card .meta{font-size:11.8px;color:var(--text-muted);margin-top:3px;}
.recorrencia-card .situacao{margin-top:5px;}
.recorrencia-card .acoes{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(8,20,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
.modal{background:var(--paper);border-radius:16px;max-width:760px;width:100%;box-shadow:var(--shadow-lg);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal-close{cursor:pointer;font-size:20px;color:var(--text-muted);border:none;background:none;}
/* [UX Paciente] Blocos numerados do modal de Novo/Editar Paciente — um
   único formulário, sem abas/wizard: só hierarquia visual mais clara. */
.form-secao{padding:16px 0;}
.form-secao:first-child{padding-top:0;}
.form-secao + .form-secao{border-top:1px solid var(--line);}
.form-secao-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.form-secao-num{font-family:"Fraunces",serif;font-size:13px;font-weight:700;color:var(--gold-500);flex-shrink:0;}
.form-secao-titulo{font-size:13px;letter-spacing:.04em;text-transform:uppercase;}
.form-secao-sub{margin:2px 0 0;font-size:12px;color:var(--text-muted);}
.form-secao-body{display:flex;flex-direction:column;gap:14px;}
[data-grupo][hidden],[data-grupo-fechamento][hidden]{display:none;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--ink-950);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:99;font-size:13px;font-weight:600;}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filters-bar select,.filters-bar input{width:auto;min-width:150px;}

.bars{display:flex;align-items:flex-end;gap:14px;padding:10px 6px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;}
.bar-box{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:150px;width:100%;}
.bar-fill{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--ink-100);border:1px solid var(--ink-700);border-bottom:none;}
.bar-col .lbl{font-size:10.6px;color:var(--text-muted);margin-top:8px;text-align:center;}
.bar-col .val{font-size:10.6px;font-weight:800;color:var(--text);margin-bottom:4px;}

.ethics-box{background:var(--info-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12.6px;color:var(--text);}
.ethics-box b{color:var(--info);}

.list-edit-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);}
.list-edit-row:last-child{border-bottom:none;}
.list-edit-row .grow{flex:1;}

.chk-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.chk-item:last-child{border-bottom:none;}

/* ===== V2 — gráficos de barra horizontal (Dashboard/Indicações) ===== */
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.hbar-row:last-child{margin-bottom:0;}
.hbar-label{width:150px;flex:0 0 150px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hbar-track{flex:1;background:var(--bg);border-radius:6px;height:14px;overflow:hidden;}
.hbar-fill{height:100%;background:var(--ink-700);border-radius:6px;}
.hbar-val{width:92px;flex:0 0 92px;text-align:right;font-size:12px;font-weight:700;}

/* ===== V2 — funil duplo (Dashboard) ===== */
.funnel-card{text-align:center;padding:18px 10px;}
.funnel-top{font-size:13px;font-weight:700;color:var(--text-muted);}
.funnel-arrow{font-family:"Fraunces",serif;font-size:22px;font-weight:700;color:var(--gold-600);margin:8px 0;}
.funnel-bottom{font-size:17px;font-weight:800;color:var(--ink-900);}

/* ===== V2 — WhatsApp (simulado) ===== */
.wa-layout{display:flex;gap:14px;min-height:520px;}
.wa-list{width:300px;flex:0 0 300px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);overflow-y:auto;max-height:calc(100vh - 210px);}
.wa-item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.wa-item:hover{background:var(--ink-100);}
.wa-item.active{background:var(--ink-100);}
.wa-item .nm{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.wa-item .snippet{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;}
.wa-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:0 0 auto;}
.wa-dot.normal{background:var(--success);}
.wa-dot.atencao{background:var(--warn);}
.wa-dot.atrasado{background:var(--danger);}
.wa-panel{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);overflow:hidden;max-height:calc(100vh - 210px);}
.wa-panel-head{padding:14px 18px;border-bottom:1px solid var(--line);}
.wa-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg);}
.wa-bubble{max-width:68%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.45;}
.wa-bubble.paciente{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px;}
.wa-bubble.clinica{align-self:flex-end;background:var(--ink-900);color:#fff;border-bottom-right-radius:4px;}
.wa-bubble .hora{display:block;font-size:10px;opacity:.65;margin-top:4px;}
.wa-compose{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);}
.wa-compose textarea{flex:1;resize:none;min-height:38px;}

/* ===== V2 — Agenda em calendário ===== */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:11px;text-transform:uppercase;color:var(--text-muted);text-align:center;font-weight:700;padding-bottom:4px;}
.cal-day{min-height:76px;border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;background:var(--paper);}
.cal-day:hover{border-color:var(--ink-700);}
.cal-day.outro-mes{visibility:hidden;pointer-events:none;}
.cal-day.hoje{border-color:var(--gold-500);border-width:2px;}
.cal-day.selecionado{background:var(--ink-100);}
.cal-day .num{font-weight:700;font-size:12.5px;}
.cal-day .qtd{margin-top:5px;font-size:10.5px;background:var(--ink-900);color:#fff;border-radius:999px;padding:1px 7px;display:inline-block;}

/* ===== V2.1 — cabeçalho fixo da tabela de Pacientes ("congelar 1ª linha") ===== */
.pacientes-scroll{max-height:calc(100vh - 250px);overflow-y:auto;overflow-x:auto;}
.pacientes-scroll thead th{position:sticky;top:0;background:var(--paper);z-index:2;box-shadow:0 1px 0 var(--line);}

/* ===== [Supabase] tela de login / gate pré-CRM (só aparece em modo Supabase) ===== */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--ink-950),var(--ink-900));padding:16px;}
.login-card{width:100%;max-width:360px;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:28px 24px;}
.login-card .field{display:block;margin-top:14px;font-size:13px;font-weight:700;color:var(--text-muted);}

// Regra automática de status — reproduz EXATAMENTE a fórmula validada em uso
// real na planilha da clínica (aba Pacientes, coluna "Status Atual"):
//
// =IF(Fechou="Sim","Fechado (Total)",
//   IF(Fechou="Parcial","Fechado (Parcial)",
//   IF(Fechou="Não","Perdido",
//   IF(Fechou="Pendente","Pendente",
//   IF(Fechou="Não precisa no momento","Não Precisa no Momento",
//   IF(Plano="Sim","Plano de Tratamento",
//   IF(Compareceu="Não","Não Compareceu",
//   IF(Compareceu="Sim","Compareceu",
//   IF(MarcouConsulta="Não","Perdido",
//   IF(MarcouConsulta="Sim","Consulta Marcada",
//   IF(Nome="","","Novo Paciente")))))))))))
function calcStatus(p){
  const f = p.fechouTratamento, pl = p.planoTratamento, c = p.compareceu, m = p.marcouConsulta;
  if (f === 'Sim') return 'Fechado (Total)';
  if (f === 'Parcial') return 'Fechado (Parcial)';
  if (f === 'Não') return 'Perdido';
  if (f === 'Pendente') return 'Pendente';
  if (f === 'Não precisa no momento') return 'Não Precisa no Momento';
  if (pl === 'Sim') return 'Plano de Tratamento';
  if (c === 'Não') return 'Não Compareceu';
  if (c === 'Sim') return 'Compareceu';
  if (m === 'Não') return 'Perdido';
  if (m === 'Sim') return 'Consulta Marcada';
  if (!p.nome) return '';
  return 'Novo Paciente';
}

let DB = null;
let AVISO_ESTADO_IGNORADO = false; // [V2 — CORREÇÃO] true quando um estado salvo foi descartado por incompatibilidade

// [V2 — CORREÇÃO] Checagem RASA: o valor salvo em localStorage tem, no
// mínimo, a "família" de campos que este CRM espera (um objeto de clínica
// + todas as listas principais como array)? Isso pega tanto o caso de um
// protótipo totalmente diferente (ex: "Clínica Sorriso Pleno") quanto
// qualquer JSON corrompido/de outra origem.
function pareceEstadoDesteCRM(db){
  if(!db || typeof db !== 'object') return false;
  if(!db.clinica || typeof db.clinica !== 'object') return false;
  const arraysObrigatorios = ['pacientes','procedimentos','origens','motivosPerda','etapasFunil','responsaveis','funcionarios','indicacoes'];
  return arraysObrigatorios.every(chave => Array.isArray(db[chave]));
}

// [V2 — CORREÇÃO] Garante o formato de UM paciente sem apagar nenhum campo
// que já exista no registro (o "...p" no início preserva tudo; os campos
// listados depois só ENTRAM em vigor quando o valor original está ausente
// ou com tipo errado).
function normalizarPaciente(p){
  return {
    ...p,
    id: p.id || uid('pac'),
    nome: p.nome || '',
    procedimentos: Array.isArray(p.procedimentos) ? p.procedimentos : [],
    valorOrcamento: p.valorOrcamento ?? null,
    valorFechado: p.valorFechado ?? null,
  };
}

// [V2 — CORREÇÃO] Passagem mais profunda que a antiga migrarEstadoV2():
// garante que TODA lista/objeto que as telas usam sem checagem (filtros de
// Pacientes, Configurações, Kanban etc.) exista com o tipo certo — usando
// os mesmos dados de exemplo padrão como fallback quando faltar. NUNCA
// apaga um campo que já existe; só preenche o que estiver faltando.
function normalizarEstado(db){
  db.clinica = (db.clinica && typeof db.clinica==='object') ? db.clinica : { nome:NOME_CLINICA, cidade:'', tempoMercado:'', especialidades:[] };
  db.usuarioAtual = db.usuarioAtual || { nome:'', cargo:'' };
  db.funcionarios = Array.isArray(db.funcionarios) ? db.funcionarios : SEED_FUNCIONARIOS.map(f=>({id:uid('func'), ...f}));
  db.procedimentos = Array.isArray(db.procedimentos) ? db.procedimentos : SEED_PROCEDIMENTOS.map(p=>({id:uid('proc'), ...p}));
  db.origens = Array.isArray(db.origens) ? db.origens : [...SEED_ORIGENS];
  db.motivosPerda = Array.isArray(db.motivosPerda) ? db.motivosPerda : [...SEED_MOTIVOS_PERDA];
  db.responsaveis = Array.isArray(db.responsaveis) ? db.responsaveis : ['Mariana','Natalia','Julia'];
  db.etapasFunil = Array.isArray(db.etapasFunil) ? db.etapasFunil : ETAPAS_PADRAO.map(e=>({...e}));
  db.indicacoes = Array.isArray(db.indicacoes) ? db.indicacoes : [];
  db.pacientes = (Array.isArray(db.pacientes) ? db.pacientes : []).map(normalizarPaciente);
  db.theme = db.theme || 'system';
  if(!Array.isArray(db.whatsappConversas)) db.whatsappConversas = seedWhatsappConversas();
  if(!Array.isArray(db.posVendasConcluidos)) db.posVendasConcluidos = [];
  // [V2.1 — migração defensiva V2 → V2.1] preenche só o que for novo,
  // sem apagar nada que já exista num estado salvo pela V2.
  if(!Array.isArray(db.acoesComerciaisConcluidas)) db.acoesComerciaisConcluidas = [];
  if(!db.novoContatoWhatsappDemo || typeof db.novoContatoWhatsappDemo!=='object'){
    db.novoContatoWhatsappDemo = { ...DADOS_DEMO_V2.novoContatoWhatsappSeed, processado:false };
  }
  return db;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const carregado = JSON.parse(raw);
      if(pareceEstadoDesteCRM(carregado)){
        // Estado reconhecível: normaliza (preenche o que faltar) e usa.
        DB = normalizarEstado(carregado);
      } else {
        // [V2 — CORREÇÃO] Estado salvo nesta chave NÃO tem a forma esperada
        // por este CRM — provavelmente outro protótipo local (mesmo
        // navegador/origem). IMPORTANTE: não apagamos esse valor de
        // localStorage nem tentamos "consertá-lo" — apenas deixamos de
        // usá-lo e partimos dos dados de exemplo da Mori. O dado antigo
        // continua salvo em disco, intacto, para quem quiser recuperá-lo.
        console.warn('Estado salvo em', STORAGE_KEY, 'não tem o formato deste CRM — ignorado com segurança, nada foi apagado.');
        DB = buildInitialState();
        saveState();
        AVISO_ESTADO_IGNORADO = true;
      }
    } else {
      DB = buildInitialState();
      saveState();
    }
  }catch(e){
    console.error('Falha ao carregar estado, recriando seed.', e);
    DB = buildInitialState();
  }
}
function saveState(){
  // [Supabase] Nesta etapa (somente leitura de pacientes), uma sessão
  // autenticada no Supabase nunca grava em localStorage — nem os dados
  // vindos do banco, nem edições feitas em tela (que ficam só na memória
  // da sessão atual). Ver MODO_SUPABASE mais abaixo.
  if(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('Falha ao salvar estado (localStorage cheio ou indisponível).', e); toast('Não foi possível salvar automaticamente. Faça um backup (Configurações → Backup).'); }
}

   3) UTILITÁRIOS
   ============================================================ */
function fmtMoeda(v){
  if(v===null||v===undefined||v==='') return '—';
  return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtData(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function diasEntre(isoA,isoB){
  if(!isoA||!isoB) return null;
  const a=new Date(isoA+'T00:00:00'), b=new Date(isoB+'T00:00:00');
  return Math.round((b-a)/86400000);
}
// [Recorrência] "Data civil de hoje" na timezone da CLÍNICA (clinicas.timezone,
// ex: 'America/Sao_Paulo'), não em UTC. hojeISO() acima continua usando UTC
// e NÃO é alterada — Resgate/Pós-Consulta/Agenda/Dashboard continuam
// exatamente como estão. Isolado aqui de propósito: só o Módulo de
// Recorrência usa esta função, para não virar o dia perto da meia-noite
// local antes da hora real da clínica. `Intl.DateTimeFormat('en-CA', ...)`
// formata direto como AAAA-MM-DD, nativo do navegador, sem biblioteca nova.
function hojeCivilClinica(){
  const tz = DB.clinicaTimezone || 'America/Sao_Paulo';
  try{
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
  }catch(e){
    console.warn(`Timezone da clínica inválido ("${tz}") — usando America/Sao_Paulo.`, e);
    try{
      return new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo' }).format(new Date());
    }catch(e2){
      return hojeISO();
    }
  }
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// [Supabase CRUD] string vazia (inclusive só espaço) vira null — usado ao
// montar o payload das RPCs de paciente, nunca manda '' para uma coluna
// com CHECK (que rejeitaria) ou para um campo date.
function nuloSeVazio(v){
  if(v===null||v===undefined) return null;
  const s = String(v).trim();
  return s===''? null : v;
}
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function monthLabel(key){
  const [y,m]=key.split('-');
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return meses[parseInt(m,10)-1]+'/'+y;
}
function toast(msg){
  const root=document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  setTimeout(()=>{ root.innerHTML=''; }, 3200);
}
function etapaCor(nome){

}

// [V2] "Vendido" = fechou tratamento Total OU Parcial (regra definitiva
// aprovada para as métricas de conversão da V2 — não considerar só "Sim").
function isVendido(p){
  return p.fechouTratamento==='Sim' || p.fechouTratamento==='Parcial';
}
function ontemISO(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function fmtMinutos(min){
  if(min===null||min===undefined) return '';
  if(min<60) return `${min} min`;
  const h = Math.floor(min/60), m = min%60;
  return `${h}h${m>0?String(m).padStart(2,'0'):''}`;
}
// Gráfico de barra horizontal reutilizado por Dashboard (origem/procedimentos)
// e Indicações (ranking de indicadores). items: [{label, count}]
function renderBarListHorizontal(items){
  if(!items.length) return '<div class="empty">Sem dados suficientes.</div>';
  const max = Math.max(...items.map(i=>i.count), 1);
  const total = items.reduce((s,i)=>s+i.count,0) || 1;
  return items.map(i=>`
    <div class="hbar-row">
      <div class="hbar-label" title="${escapeHtml(i.label)}">${escapeHtml(i.label)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(i.count/max*100).toFixed(1)}%"></div></div>
      <div class="hbar-val">${i.count} <span class="muted">(${(i.count/total*100).toFixed(0)}%)</span></div>
    </div>`).join('');
}

/* ============================================================
   DATA REAL COM FALLBACK LEGADO — data_perda / data_envio_plano
   ------------------------------------------------------------
   [Auditoria de derivações, confirmada por consulta ao Supabase]
   As colunas `pacientes.data_perda` e `pacientes.data_envio_plano`
   existem e já chegam mapeadas (`p.dataPerda`/`p.dataEnvioPlano`), mas
   NENHUM dos 79 pacientes migrados tem essas colunas preenchidas (9
   perdidos, 0 com data_perda; 49 com plano, 0 com data_envio_plano) —
   não houve backfill retroativo, por decisão explícita (não gravar data
   aproximada como se fosse fato histórico).
   Estratégia de transição: o campo real do Supabase é SEMPRE a fonte de
   verdade quando preenchido; a derivação antiga (a partir de
   dataFechamento/dataConsulta/dataContato) só roda como FALLBACK LEGADO
   para registros sem o campo real — nunca sobrepõe um valor real
   existente. Os critérios comerciais (30 dias para resgate, 1 dia para
   follow-up de plano) não mudam nesta correção.
   ============================================================ */
// Data real de perda (fonte de verdade) — só cai para a aproximação
// legada quando o Supabase ainda não tem data_perda registrada.
function obterDataPerdaComFallbackLegado(p){
  if(p.dataPerda) return p.dataPerda;
  return p.dataFechamento || p.dataConsulta || p.dataContato || null;
}
function infoResgate(p){
  const dataPerda = obterDataPerdaComFallbackLegado(p);
  const dias = diasEntre(dataPerda, hojeISO());
  return { dataPerda, dias, elegivel: dias!==null && dias>=30 };
}
// Data real de envio do plano (fonte de verdade) — só cai para a
// aproximação legada (data da consulta/contato) quando o Supabase ainda
// não tem data_envio_plano registrada.
function obterDataEnvioPlanoComFallbackLegado(p){
  if(p.dataEnvioPlano) return p.dataEnvioPlano;
  return p.dataConsulta || p.dataContato || null;
}
function estadoPlanoTratamentoDemo(p){
  if(p.planoTratamento !== 'Sim') return { estado:'nao_enviado', label:'Não enviado' };
  const resolvido = isVendido(p) || p.fechouTratamento==='Não' || p.fechouTratamento==='Não precisa no momento';
  if(resolvido) return { estado:'enviado', label:'Enviado' };
  const concluido = acaoComercialConcluida('followup_plano', p.id);
  if(concluido) return { estado:'followup_feito', label:'Follow-up realizado', dataHora:concluido.dataHora };
  const dataEnvio = obterDataEnvioPlanoComFallbackLegado(p);
  const dias = diasEntre(dataEnvio, hojeISO());
  if(dias!==null && dias>=1) return { estado:'followup', label:'Follow-up necessário' };
  return { estado:'enviado', label:'Enviado' };
}

// [Fase A] data_elegivel = "primeira data em que a ação está elegível"
// (data-âncora + N dias), NUNCA a data-âncora em si. Usa o MESMO fallback
// legado de obterDataPerdaComFallbackLegado()/obterDataEnvioPlanoComFallbackLegado()
// acima — mesma fonte de verdade da RPC concluir_acao_comercial() (que
// replica este cálculo em SQL), senão o "já concluído?" calculado aqui no
// JS nunca bateria com o data_elegivel gravado de verdade no Supabase.
// O fallback é só compatibilidade com pacientes HISTÓRICOS migrados antes
// de data_perda/data_envio_plano existirem no fluxo — nunca justificativa
// para paciente novo deixar de preencher o campo real.
function addDiasISO(iso, dias){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+dias);
  return d.toISOString().slice(0,10);
}
function dataElegivelAcaoComercial(tipo, p){
  if(tipo==='resgate'){
    const base = obterDataPerdaComFallbackLegado(p);
    return base ? addDiasISO(base, 30) : null;
  }
  if(tipo==='followup_plano'){
    const base = obterDataEnvioPlanoComFallbackLegado(p);
    return base ? addDiasISO(base, 1) : null;
  }
  if(tipo==='pos_consulta'){
    return p.dataConsulta ? addDiasISO(p.dataConsulta, 1) : null;
  }
  return null;
}

/* ============================================================
   [V2.1 → Fase A] AÇÕES COMERCIAIS — estrutura comum enxuta
   ------------------------------------------------------------
   Resgate, Follow-up de Plano e (a partir da Fase A) Pós-Consulta usam a
   mesma ideia: "isso ficou pendente, a secretária fez o contato, agora
   precisa CONFIRMAR que a ação foi realizada" — abrir o WhatsApp sozinho
   não conclui nada.
   Em modo Supabase, a fonte de verdade passa a ser 100% `public.acoes_comerciais`
   (via RPC `concluir_acao_comercial`, que deriva clinica_id/usuario_id/
   data_elegivel no servidor — nunca aceitos do navegador) — nenhuma
   gravação local. `DB._acoesComerciaisSupabase` é um cache em memória
   (recarregado após cada conclusão, ver recarregarAcoesComerciaisSupabase())
   só para as leituras síncronas que o render() precisa fazer.
   Em modo local (sem Supabase), o comportamento antigo (`DB.acoesComerciaisConcluidas`)
   continua exatamente como estava — nada quebra.
   ============================================================ */
async function concluirAcaoComercial(tipo, pacienteId){
  if(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE){
    const { error } = await window.moriSupabase.rpc('concluir_acao_comercial', {
      p_paciente_id: pacienteId, p_tipo: tipo,
    });
    if(error){
      console.error(`Falha ao concluir ação comercial (${tipo}).`, error);
      toast('Não foi possível registrar. Tente novamente.');
      return false;
    }
    await recarregarAcoesComerciaisSupabase();
    return true;
  }
  if(!acaoComercialConcluida(tipo, pacienteId)){
    DB.acoesComerciaisConcluidas.push({ tipo, pacienteId, dataHora:new Date().toISOString() });
    saveState();
  }
  return true;
}
function acaoComercialConcluida(tipo, pacienteId){
  if(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE){
    const p = DB.pacientes.find(x=>x.id===pacienteId);
    if(!p) return null;
    const dataElegivel = dataElegivelAcaoComercial(tipo, p);
    if(!dataElegivel) return null;
    const achado = (DB._acoesComerciaisSupabase||[]).find(a=>
      a.paciente_id===pacienteId && a.tipo===tipo && a.data_elegivel===dataElegivel
    );
    // Mantém o mesmo formato {tipo, pacienteId, dataHora} que todo o
    // código existente (Kanban, Pacientes, WhatsApp) já espera — nenhum
    // outro ponto de leitura precisou ser alterado por causa disso.
    return achado ? { tipo, pacienteId, dataHora: achado.data_conclusao } : null;
  }
  return DB.acoesComerciaisConcluidas.find(a=>a.tipo===tipo && a.pacienteId===pacienteId) || null;
}

/* ============================================================
   [Recorrência] Módulo de Recorrência de Pacientes
   ------------------------------------------------------------
   Fonte de verdade 100% Supabase (tipos_recorrencia, ciclos_recorrencia,
   retornos_recorrencia) — sem persistência paralela em localStorage. Em
   modo local (sem Supabase), a tela mostra um estado "indisponível" (ver
   renderRecorrencia()) em vez de simular o módulo.
   Toda escrita passa pelas RPCs homologadas (iniciar_ciclo_recorrencia,
   registrar_retorno_recorrencia, finalizar_ciclo_recorrencia) — nenhum
   INSERT/UPDATE direto nestas tabelas a partir daqui (o próprio banco já
   bloqueia isso, mas o frontend também nunca tenta).
   ============================================================ */

const MOTIVOS_ENCERRAMENTO_RECORRENCIA = [
  'Tratamento concluído',
  'Paciente não continuará o tratamento',
  'Mudou de clínica/profissional',
  'Recorrência não é mais necessária',
  'Outro',
];

const CATEGORIAS_RECORRENCIA = [
  { id:'atrasados', label:'🔴 Atrasados' },
  { id:'hoje', label:'Hoje' },
  { id:'proximos7', label:'🟡 Próximos 7 dias' },
  { id:'emdia', label:'🟢 Em dia' },
  { id:'finalizados', label:'⚪ Finalizados' },
];

// Estado de UI local à tela (mesmo padrão de agendaMes/whatsappConversaSelecionadaId
// — variável de módulo, não precisa ir para DB/localStorage).
let filtroRecorrenciaCategoria = 'atrasados';
let destacarCicloRecorrenciaId = null;

// Categorização mutuamente exclusiva — ver arquitetura aprovada (item 9).
// Usa hojeCivilClinica(), nunca hojeISO(), para não virar o dia perto da
// meia-noite antes da hora real da clínica.
function classificarCicloRecorrencia(ciclo){
  if(ciclo.status === 'finalizado') return 'finalizados';
  const dias = diasEntre(hojeCivilClinica(), ciclo.proximoRetorno); // negativo=atrasado, 0=hoje, positivo=futuro
  if(dias < 0) return 'atrasados';
  if(dias === 0) return 'hoje';
  if(dias <= 7) return 'proximos7';
  return 'emdia';
}

function agruparCiclosRecorrenciaPorCategoria(){
  const grupos = { atrasados:[], hoje:[], proximos7:[], emdia:[], finalizados:[] };
  (DB.ciclosRecorrencia||[]).forEach(c=>{ grupos[classificarCicloRecorrencia(c)].push(c); });
  return grupos;
}

function ordenarCategoriaRecorrencia(categoria, items){
  const arr = items.slice();
  if(categoria==='hoje'){
    arr.sort((a,b)=>a.pacienteNome.localeCompare(b.pacienteNome,'pt-BR'));
  } else if(categoria==='finalizados'){
    arr.sort((a,b)=>(b.dataEncerramento||'').localeCompare(a.dataEncerramento||''));
  } else {
    // atrasados/proximos7/emdia: retorno mais próximo (ou mais atrasado) primeiro.
    arr.sort((a,b)=>(a.proximoRetorno||'').localeCompare(b.proximoRetorno||''));
  }
  return arr;
}

// Contador do menu lateral = Atrasados + Hoje, nunca os demais (item 4).
function contarRecorrenciasUrgentes(){
  if(!(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE)) return 0;
  const grupos = agruparCiclosRecorrenciaPorCategoria();
  return grupos.atrasados.length + grupos.hoje.length;
}

function cicloAtivoDoPaciente(pacienteId){
  return (DB.ciclosRecorrencia||[]).find(c=>c.pacienteId===pacienteId && c.status==='ativo') || null;
}

// [Supabase] Join client-side com dados já carregados (paciente/tipo/
// responsável) — mesmo padrão de mapPacienteSupabaseParaCRM: nenhuma view
// nova no banco, nenhuma duplicação de paciente/responsável em estrutura
// paralela (item 5).
function mapCicloSupabaseParaCRM(row){
  const paciente = DB.pacientes.find(x=>x.id===row.paciente_id);
  const tipo = (DB.tiposRecorrenciaTodos||[]).find(t=>t.id===row.tipo_recorrencia_id);
  const responsavelProfile = (DB.equipeSupabase||[]).find(pr=>pr.id===row.responsavel_id);
  return {
    id: row.id,
    pacienteId: row.paciente_id,
    pacienteNome: paciente ? paciente.nome : '(paciente não encontrado)',
    tipoId: row.tipo_recorrencia_id,
    tipoNome: tipo ? tipo.nome : '(tipo não encontrado)',
    responsavelId: row.responsavel_id || null,
    responsavelNome: responsavelProfile ? responsavelProfile.nome : '',
    dataInicio: row.data_inicio,
    proximoRetorno: row.proximo_retorno,
    status: row.status,
    dataEncerramento: row.data_encerramento || null,
    motivoEncerramento: row.motivo_encerramento || null,
    observacoes: row.observacoes || '',
    observacaoEncerramento: row.observacao_encerramento || null,
  };
}
function mapRetornoSupabaseParaCRM(row){
  const usuario = (DB.equipeSupabase||[]).find(pr=>pr.id===row.usuario_id);
  return {
    id: row.id,
    cicloId: row.ciclo_id,
    dataRetornoRealizado: row.data_retorno_realizado,
    proximoRetornoDefinido: row.proximo_retorno_definido,
    observacao: row.observacao || '',
    usuarioNome: usuario ? usuario.nome : '',
  };
}

// Reconsulta só ciclos/retornos (sem recarregar os 79 pacientes) depois de
// iniciar/registrar/finalizar um ciclo — mesmo padrão de
// recarregarAcoesComerciaisSupabase().
async function recarregarCiclosRecorrenciaSupabase(){
  const [{ data:ciclosRows, error:errCiclos }, { data:retornosRows, error:errRetornos }] = await Promise.all([
    window.moriSupabase.from('ciclos_recorrencia').select('*'),
    window.moriSupabase.from('retornos_recorrencia').select('*'),
  ]);
  if(errCiclos || errRetornos){
    console.error('Falha ao recarregar dados de Recorrência.', errCiclos||errRetornos);
    toast('Não foi possível atualizar os dados de Recorrência agora.');
    return false;
  }
  DB.ciclosRecorrencia = (ciclosRows||[]).map(mapCicloSupabaseParaCRM);
  DB._retornosRecorrenciaSupabase = (retornosRows||[]).map(mapRetornoSupabaseParaCRM);
  return true;
}

// [Recorrência] Wrappers das 3 RPCs homologadas — nenhum INSERT/UPDATE
// direto em ciclos_recorrencia/retornos_recorrencia a partir daqui (o
// banco já bloqueia, mas o frontend segue o mesmo caminho documentado).
async function iniciarCicloRecorrencia({ pacienteId, tipoId, dataInicio, proximoRetorno, responsavelId, observacoes }){
  const { data, error } = await window.moriSupabase.rpc('iniciar_ciclo_recorrencia', {
    p_paciente_id: pacienteId,
    p_tipo_recorrencia_id: tipoId,
    p_data_inicio: dataInicio,
    p_proximo_retorno: proximoRetorno,
    p_responsavel_id: responsavelId || null,
    p_observacoes: observacoes || null,
  });
  if(error){ console.error('Falha ao iniciar ciclo de recorrência.', error); return { ok:false, error }; }
  await recarregarCiclosRecorrenciaSupabase();
  return { ok:true, data };
}
async function registrarRetornoRecorrencia({ cicloId, dataRetorno, proximoRetorno, observacao }){
  const { data, error } = await window.moriSupabase.rpc('registrar_retorno_recorrencia', {
    p_ciclo_id: cicloId,
    p_data_retorno_realizado: dataRetorno,
    p_proximo_retorno: proximoRetorno,
    p_observacao: observacao || null,
  });
  if(error){ console.error('Falha ao registrar retorno.', error); return { ok:false, error }; }
  await recarregarCiclosRecorrenciaSupabase();
  return { ok:true, data };
}
async function finalizarCicloRecorrencia({ cicloId, dataEncerramento, motivo, observacaoEncerramento }){
  const { data, error } = await window.moriSupabase.rpc('finalizar_ciclo_recorrencia', {
    p_ciclo_id: cicloId,
    p_data_encerramento: dataEncerramento,
    p_motivo_encerramento: motivo,
    p_observacao_encerramento: observacaoEncerramento || null,
  });
  if(error){ console.error('Falha ao finalizar ciclo de recorrência.', error); return { ok:false, error }; }
  await recarregarCiclosRecorrenciaSupabase();
  return { ok:true, data };
}

function bindGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>navigate(el.dataset.nav));
  });
  const themeBtn = document.querySelector('[data-action="toggle-theme"]');
  if(themeBtn) themeBtn.addEventListener('click', ()=>{
    DB.theme = DB.theme==='dark' ? 'light' : (DB.theme==='light' ? 'system' : 'dark');
    saveState(); render();
  });
  const novoBtn = document.querySelector('[data-action="novo-paciente"]');
  if(novoBtn) novoBtn.addEventListener('click', ()=>openPacienteModal(null));

  // [V2] Botões reutilizáveis de navegação entre módulos (Kanban, Pacientes,
  // Pós-Vendas e Agenda podem todos aparecer na mesma tela renderizada, por
  // isso ficam centralizados aqui em vez de repetidos em cada bindXEvents).
  document.querySelectorAll('[data-wa-paciente]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const contexto = el.dataset.waContexto ? { tipo: el.dataset.waContexto } : null;
      abrirWhatsAppPaciente(el.dataset.waPaciente, contexto);
    });
  });
  document.querySelectorAll('[data-ver-paciente]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); abrirPaciente(el.dataset.verPaciente); });
  });
  // [Recorrência] "Abrir na Recorrência" — navegação contextual reaproveitando
  // ROUTE_PARAM (já existia, não usado até agora) em vez de criar um segundo
  // sistema de navegação paralelo. Ver renderRecorrencia() para o consumo.
  document.querySelectorAll('[data-abrir-recorrencia]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      closeModal();
      navigate('recorrencia', { cicloId: el.dataset.abrirRecorrencia, pacienteId: el.dataset.abrirRecorrenciaPaciente });
    });
  });
  document.querySelectorAll('[data-ir-para-config]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); closeModal(); navigate('config'); });
  });

  // [V2.1] Conclusão explícita de ações comerciais — nunca automática só
  // por abrir o WhatsApp (ver seção "AÇÕES COMERCIAIS" no código).
  // [Fase A] concluirAcaoComercial() agora é assíncrona em modo Supabase
  // (chama a RPC) — o botão fica desabilitado durante o envio (trata
  // duplo clique) e só re-habilita sozinho se der erro (sucesso já troca
  // o DOM inteiro via render()).
  document.querySelectorAll('[data-resgate-realizado]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(el.disabled) return;
      el.disabled = true;
      const ok = await concluirAcaoComercial('resgate', el.dataset.resgateRealizado);
      if(ok){ render(); toast('Resgate marcado como realizado.'); }
      else { el.disabled = false; }
    });
  });
  document.querySelectorAll('[data-followup-realizado]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(el.disabled) return;
      el.disabled = true;
      const ok = await concluirAcaoComercial('followup_plano', el.dataset.followupRealizado);
      if(ok){ render(); toast('Follow-up marcado como realizado.'); }
      else { el.disabled = false; }
    });
  });
  // Atalho de conclusão direto de dentro da conversa de WhatsApp (item 10).
  document.querySelectorAll('[data-wa-concluir-acao]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      if(el.disabled) return;
      const tipo = el.dataset.waConcluirAcao;
      const conversa = DB.whatsappConversas.find(c=>c.id===whatsappConversaSelecionadaId);
      if(!conversa) return;
      el.disabled = true;
      // [Fase A] pos_consulta (ex-pos_venda) passa a usar a mesma RPC em modo
      // Supabase. Em modo local, mantém o mecanismo antigo intacto
      // (DB.posVendasConcluidos) — não precisa quebrar o que já funciona.
      if(tipo==='pos_consulta' && !(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE)){
        if(!DB.posVendasConcluidos.includes(conversa.pacienteId)) DB.posVendasConcluidos.push(conversa.pacienteId);
        saveState();
        render();
        toast('Ação marcada como realizada.');
        return;
      }
      const ok = await concluirAcaoComercial(tipo, conversa.pacienteId);
      if(ok){ render(); toast('Ação marcada como realizada.'); }
      else { el.disabled = false; }
    });
  });

  // [V2 — CORREÇÃO] Ações da tela de recuperação (telaDeErro) — reutilizam
  // as funções de backup já existentes; nunca apagam dados sem confirmação.
  const baixarBtn = document.querySelector('[data-action="baixar-estado-atual"]');
  if(baixarBtn) baixarBtn.addEventListener('click', exportBackupJSON);
  const resetBtn = document.querySelector('[data-action="resetar-dados"]');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(confirm('Isso substitui o estado atual deste navegador pelos dados de exemplo da Mori Ortodontia. Se quiser guardar o que está salvo agora, baixe o backup antes de continuar. Deseja restaurar os dados de exemplo?')){
      DB = buildInitialState(); saveState(); render();
      toast('Dados de exemplo da Mori Ortodontia restaurados.');
    }
  });
}

let filtroPacientes = {origem:'',procedimento:'',responsavel:'',status:'',busca:''};

function pacientesFiltrados(){
  return DB.pacientes.filter(p=>{
    const status = calcStatus(p);
    if(filtroPacientes.origem && p.origem!==filtroPacientes.origem) return false;
    if(filtroPacientes.responsavel && p.responsavel!==filtroPacientes.responsavel) return false;
    if(filtroPacientes.status && status!==filtroPacientes.status) return false;
    if(filtroPacientes.procedimento && !(p.procedimentos||[]).includes(filtroPacientes.procedimento)) return false;
    if(filtroPacientes.busca){
      const q = filtroPacientes.busca.toLowerCase();
      if(!p.nome.toLowerCase().includes(q) && !(p.telefone||'').includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.dataContato||'').localeCompare(a.dataContato||''));
}

function renderPacientes(){
  const lista = pacientesFiltrados();
  const statusOptions = [...ETAPAS_PADRAO.map(e=>e.nome)];
  return `
  <div class="card">

      <select data-filter="status"><option value="">Todos os status</option>${statusOptions.map(s=>`<option value="${escapeHtml(s)}" ${filtroPacientes.status===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select>

// [V2] células auxiliares da tabela de Pacientes — cada uma isolada para
// ficar fácil de reaproveitar (ex: mesma badge de Radiografia em outro lugar).
function celulaRadiografia(p){
  if(p.fezRadiografia==='Sim') return `<span class="badge-status" style="background:var(--success-bg);color:var(--success);">Sim</span>`;
  if(p.fezRadiografia==='Não') return `<span class="badge-status" style="background:var(--ink-100);color:var(--text-muted);">Não</span>`;
  return '<span class="muted">—</span>';
}
// [V2.1 — CORREÇÃO] Esta coluna mostra SOMENTE o status `fechouTratamento`
// (Sim/Parcial/Pendente/Não precisa no momento/Não) — nunca mais o valor em
// R$. O valor fechado continua existindo normalmente no cadastro/cálculos,
// só não aparece mais misturado nesta célula.
function celulaFechado(p){
  if(!p.fechouTratamento) return '<span class="muted">—</span>';
  const ok = p.fechouTratamento==='Sim' || p.fechouTratamento==='Parcial';
  const ruim = p.fechouTratamento==='Não';
  const bg = ok? 'var(--success-bg)' : ruim? 'var(--danger-bg)' : 'var(--warn-bg)';
  const cor = ok? 'var(--success)' : ruim? 'var(--danger)' : 'var(--warn)';
  return `<span class="badge-status" style="background:${bg};color:${cor};">${escapeHtml(p.fechouTratamento)}</span>`;
}
function celulaPlano(p){
  const info = estadoPlanoTratamentoDemo(p);
  const estilos = {
    nao_enviado: 'background:var(--ink-100);color:var(--text-muted);',
    enviado: 'background:var(--success-bg);color:var(--success);',
    followup: 'background:var(--danger-bg);color:var(--danger);font-weight:800;',
    followup_feito: 'background:var(--ink-100);color:var(--text-muted);', // [V2.1]
  };
  return `<span class="badge-status" style="${estilos[info.estado]}">${escapeHtml(info.label)}</span>`;
}
function celulaAcao(p){
  const plano = estadoPlanoTratamentoDemo(p);
  if(plano.estado==='followup'){
    // [V2.1] abrir o WhatsApp não conclui o follow-up — a secretária
    // precisa confirmar explicitamente com o botão ao lado.
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn sm gold" data-wa-paciente="${p.id}" data-wa-contexto="followup_plano">WhatsApp</button>
      <button class="btn sm primary" data-followup-realizado="${p.id}">Marcar follow-up realizado</button>
    </div>`;
  }
  if(plano.estado==='followup_feito'){
    const dataTxt = plano.dataHora ? ' em '+fmtData(plano.dataHora.slice(0,10)) : '';
    return `<span class="muted small">✓ Follow-up realizado${dataTxt}</span>`;
  }
  if(isVendido(p)) return `<span class="muted small">Fechado</span>`;
  return '<span class="muted">—</span>';
}

  // [V2.1] Botão WhatsApp do modal — reaproveita abrirWhatsAppPaciente(),

  const waModalBtn = modalRoot.querySelector('[data-modal-whatsapp]');
  if(waModalBtn) waModalBtn.addEventListener('click', ()=>{

  modalRoot.querySelectorAll('.chip-check').forEach(el=>{

  const delBtn = modalRoot.querySelector('[data-del]');

    // [Supabase CRUD] Modo Supabase: escrita real via RPC, nunca em
    // localStorage/DB em memória direto. Fluxo local abaixo continua
    // inalterado — as duas rotas são propositalmente separadas (ver
    // requisito "compatibilidade localStorage").
    if(typeof MODO_SUPABASE !== 'undefined' && MODO_SUPABASE){
      salvarPacienteSupabase(e.target, fd, procedimentos, p, isNew);
      return;
    }

    const novo = {
      ...p,
      nome: fd.get('nome').trim(),
      telefone: fd.get('telefone').trim(),
      email: fd.get('email').trim(),
      origem: fd.get('origem'),
      procedimentos,
      responsavel: fd.get('responsavel'),
      dataContato: fd.get('dataContato'),
      marcouConsulta: fd.get('marcouConsulta'),
      dataConsulta: fd.get('dataConsulta'),
      compareceu: fd.get('compareceu'),
      fezRadiografia: fd.get('fezRadiografia'),
      planoTratamento: fd.get('planoTratamento'),
      valorOrcamento: fd.get('valorOrcamento')? parseFloat(fd.get('valorOrcamento')) : null,
      fechouTratamento: fd.get('fechouTratamento'),
      valorFechado: fd.get('valorFechado')? parseFloat(fd.get('valorFechado')) : null,
      dataFechamento: fd.get('dataFechamento'),
      motivoPerda: fd.get('motivoPerda'),
      observacoes: fd.get('observacoes'),
      indicadoPor: fd.get('indicadoPor')?.trim() || '',
    };
    if(!novo.nome){ toast('Informe o nome do paciente.'); return; }
    const idx = DB.pacientes.findIndex(x=>x.id===novo.id);
    if(idx>=0) DB.pacientes[idx]=novo; else DB.pacientes.push(novo);

    // sincroniza aba de Indicações
    if(novo.origem==='Indicação'){
      const iIdx = DB.indicacoes.findIndex(i=>i.pacienteIndicado===novo.nome);
      if(iIdx>=0) DB.indicacoes[iIdx].indicadoPor = novo.indicadoPor;
      else DB.indicacoes.push({id:uid('ind'), pacienteIndicado:novo.nome, indicadoPor:novo.indicadoPor});
    }
    saveState(); closeModal(); render();
    toast(isNew? 'Paciente cadastrado.' : 'Paciente atualizado.');
  });
}
// [UX Paciente] Progressive disclosure dos blocos 02/03/04 do modal de
// paciente — roda no render inicial (então Editar já abre com o estado
// certo, já que os selects vêm preenchidos do banco) e em cada `change`
// dos selects-gatilho (então Novo começa simples e vai se expandindo).
// Nunca limpa valor de input nenhum — só alterna `hidden` no grupo.
function aplicarCondicionaisPacienteModal(modalRoot){
  const form = modalRoot.querySelector('#form-paciente');
  if(!form) return;

  const selMarcou = form.querySelector('[data-gate="marcouConsulta"]');
  const grpConsulta = form.querySelector('[data-grupo="dataConsulta"]');
  const atualizarConsulta = ()=>{ grpConsulta.hidden = selMarcou.value !== 'Sim'; };
  if(selMarcou && grpConsulta){ selMarcou.addEventListener('change', atualizarConsulta); atualizarConsulta(); }

  const selPlano = form.querySelector('[data-gate="planoTratamento"]');
  const grpOrcamento = form.querySelector('[data-grupo="valorOrcamento"]');
  const atualizarPlano = ()=>{ grpOrcamento.hidden = selPlano.value !== 'Sim'; };
  if(selPlano && grpOrcamento){ selPlano.addEventListener('change', atualizarPlano); atualizarPlano(); }

  const selFechou = form.querySelector('[data-gate="fechouTratamento"]');
  const grpSucesso = form.querySelector('[data-grupo-fechamento="sucesso"]');
  const grpPerda = form.querySelector('[data-grupo-fechamento="perda"]');
  // [Correção] "Perdido" tem DOIS caminhos em calcStatus(): fechouTratamento
  // === 'Não' OU marcouConsulta === 'Não' (lead que nunca marcou consulta).
  // Usar só o select de Fechamento deixava o grupo (Motivo/Data da Perda)
  // escondido para o segundo caminho, mesmo com data_perda real existindo
  // — reaproveita calcStatus() (só leitura, função não alterada) para
  // cobrir os dois casos corretamente.
  const atualizarFechamento = ()=>{
    const v = selFechou.value;
    const statusAtual = calcStatus({
      nome: form.querySelector('[name="nome"]').value,
      fechouTratamento: v,
      planoTratamento: selPlano ? selPlano.value : '',
      compareceu: (form.querySelector('[name="compareceu"]')||{}).value || '',
      marcouConsulta: selMarcou ? selMarcou.value : '',
    });
    if(grpSucesso) grpSucesso.hidden = !(v==='Sim' || v==='Parcial');
    if(grpPerda) grpPerda.hidden = statusAtual !== 'Perdido';
  };
  if(selFechou){ selFechou.addEventListener('change', atualizarFechamento); atualizarFechamento(); }
  if(selMarcou){ selMarcou.addEventListener('change', atualizarFechamento); }

  // [Recorrência] Só existe no DOM quando o paciente NÃO tem ciclo ativo
  // (ver bloco 05 em openPacienteModal) — quando há ciclo ativo, o bloco é
  // só leitura e este seletor nem é renderizado, então os querySelector
  // abaixo retornam null e o `if` seguinte não faz nada.
  const selRecorrente = form.querySelector('[data-gate="recorrente"]');
  const grpRecorrencia = form.querySelector('[data-grupo="camposRecorrencia"]');
  if(selRecorrente && grpRecorrencia){
    const atualizarRecorrente = ()=>{ grpRecorrencia.hidden = selRecorrente.value !== 'Sim'; };
    selRecorrente.addEventListener('change', atualizarRecorrente);
    atualizarRecorrente();
  }
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ============================================================
   [Supabase CRUD] Cadastro/Edição real de paciente via RPC
   ------------------------------------------------------------
   Toda escrita passa exclusivamente por criar_paciente_com_procedimentos
   / atualizar_paciente_com_procedimentos (homologadas no banco real,
   migration 20261010000000_rpc_paciente_atomico.sql). Nenhum INSERT/
   UPDATE/DELETE direto em `pacientes` ou `paciente_procedimentos` a
   partir daqui. clinica_id/created_by/updated_by/status/data_perda/
   data_envio_plano são sempre derivados/calculados no servidor — o
   frontend nunca os inventa nem envia.
   ============================================================ */

// [Requisito 4] Consulta SEMPRE fresca ao Supabase (nunca só DB.pacientes
// em memória, que pode estar desatualizado com outra sessão simultânea).
async function verificarTelefoneDuplicadoSupabase(telefoneE164, pacienteIdAtual){
  let query = window.moriSupabase
    .from('pacientes_com_status')
    .select('id, nome')
    .eq('telefone_e164', telefoneE164)
    .limit(1);
  if(pacienteIdAtual) query = query.neq('id', pacienteIdAtual);
  const { data, error } = await query;
  if(error){
    console.error('Falha ao verificar telefone duplicado.', error);
    return null; // falha nesta checagem de UX não deve travar o salvamento
  }
  return (data && data[0]) || null;
}

// Mini-modal sobreposto ao modal de paciente já aberto (não o substitui).
// Resolve com 'abrir' | 'cadastrar' | 'cancelar'.
function mostrarConfirmacaoTelefoneDuplicado(pacienteEncontrado){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-backdrop';
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px;">
        <div class="modal-head"><h3>Telefone já cadastrado</h3></div>
        <div class="modal-body">
          <p>Já existe um paciente com este telefone: <b>${escapeHtml(pacienteEncontrado.nome)}</b></p>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" data-dup="cancelar">Cancelar</button>
          <button type="button" class="btn gold" data-dup="abrir">Abrir Paciente Existente</button>
          <button type="button" class="btn primary" data-dup="cadastrar">Cadastrar Mesmo Assim</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const finalizar = (escolha)=>{ overlay.remove(); resolve(escolha); };
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) finalizar('cancelar'); });
    overlay.querySelectorAll('[data-dup]').forEach(btn=>{
      btn.addEventListener('click', ()=>finalizar(btn.getAttribute('data-dup')));
    });
  });
}

async function salvarPacienteSupabase(form, fd, procedimentosSelecionados, p, isNew){
  const refsBase = DB._refsSupabase;
  const nome = (fd.get('nome')||'').trim();
  if(!nome){ toast('Informe o nome do paciente.'); return; }

  const telefoneOriginal = nuloSeVazio((fd.get('telefone')||'').trim());
  const telefoneE164 = normalizarTelefoneE164BR(telefoneOriginal);

  // [Requisito 4] Só verifica duplicidade com telefone_e164 válido.
  if(telefoneE164){
    const encontrado = await verificarTelefoneDuplicadoSupabase(telefoneE164, isNew? null : p.id);
    if(encontrado){
      const escolha = await mostrarConfirmacaoTelefoneDuplicado(encontrado);
      if(escolha==='abrir'){
        closeModal();
        const existente = DB.pacientes.find(x=>x.id===encontrado.id);
        if(existente) openPacienteModal(existente);
        else toast('Paciente encontrado, mas não está na lista carregada. Atualize a página.');
        return;
      }
      if(escolha==='cancelar') return; // mantém o modal atual aberto, nada é enviado
      // escolha === 'cadastrar' -> segue o fluxo normal abaixo, sem merge
    }
  }

  const origemNome = fd.get('origem') || '';
  const responsavelNome = fd.get('responsavel') || '';
  const motivoNome = fd.get('motivoPerda') || '';
  const procedimentoIds = procedimentosSelecionados
    .map(nomeSel => ((DB.procedimentosTodos||DB.procedimentos).find(x=>x.nome===nomeSel) || {}).id)
    .filter(Boolean);

  // [Recorrência] Campo só existe no formulário quando o bloco 05 estava em
  // modo "toggle" (sem ciclo ativo) — vem null quando o paciente já tem
  // ciclo ativo (bloco só leitura) ou em modo local (bloco não oferece o
  // campo). Novo Paciente: vai dentro da MESMA chamada RPC (atômico —
  // item 20). Paciente existente: chamada separada depois do save
  // (item 21), tratada ao final desta função.
  const recorrente = fd.get('recorrente');
  const recorrenciaTipoId = fd.get('recorrenciaTipo');
  const recorrenciaDataInicio = fd.get('recorrenciaDataInicio');
  const recorrenciaProximoRetorno = fd.get('recorrenciaProximoRetorno');
  const recorrenciaResponsavelNome = fd.get('recorrenciaResponsavel') || '';
  if(recorrente === 'Sim' && (!recorrenciaTipoId || !recorrenciaDataInicio || !recorrenciaProximoRetorno)){
    // Validação ANTES de desabilitar o botão/chamar qualquer RPC — nada foi
    // enviado ainda, o modal continua exatamente como estava.
    toast('Preencha tipo, data de início e próximo retorno para iniciar a recorrência.');
    return;
  }

  const payload = {
    p_nome: nome,
    p_telefone_original: telefoneOriginal,
    p_telefone_e164: telefoneE164,
    p_email: nuloSeVazio((fd.get('email')||'').trim()),
    p_origem_id: refsBase.origensPorNome[origemNome] || null,
    // Campo legado sem input próprio no formulário — preserva o valor já
    // existente (a RPC faz UPDATE de todas as colunas, não parcial).
    p_procedimento_original: p.procedimentoOriginal || null,
    p_responsavel_id: refsBase.responsaveisPorNome[responsavelNome] || null,
    p_data_contato: nuloSeVazio(fd.get('dataContato')),
    p_marcou_consulta: nuloSeVazio(fd.get('marcouConsulta')),
    p_data_consulta: nuloSeVazio(fd.get('dataConsulta')),
    p_compareceu: nuloSeVazio(fd.get('compareceu')),
    p_fez_radiografia: nuloSeVazio(fd.get('fezRadiografia')),
    p_plano_tratamento: nuloSeVazio(fd.get('planoTratamento')),
    p_valor_orcamento: fd.get('valorOrcamento')? parseFloat(fd.get('valorOrcamento')) : null,
    p_fechou_tratamento: nuloSeVazio(fd.get('fechouTratamento')),
    p_valor_fechado: fd.get('valorFechado')? parseFloat(fd.get('valorFechado')) : null,
    p_data_fechamento: nuloSeVazio(fd.get('dataFechamento')),
    p_motivo_perda_id: refsBase.motivosPorNome[motivoNome] || null,
    p_observacoes: nuloSeVazio((fd.get('observacoes')||'').trim()),
    p_procedimento_ids: procedimentoIds,
  };
  // Nunca enviados: clinica_id, created_by, updated_by, status, data_perda,
  // data_envio_plano, indicadoPor — derivados/calculados no servidor ou
  // fora do escopo desta rodada (indicações ficam para outra etapa).
  if(!isNew) payload.p_paciente_id = p.id;

  // [Recorrência — item 20] Novo Paciente + recorrente=Sim: parâmetros
  // opcionais já existentes na RPC homologada — MESMA chamada, atômica.
  // Se a recorrência falhar (ex: tipo inválido), toda a função no banco
  // sofre rollback — o paciente também não fica criado. Não criamos
  // paciente numa chamada e ciclo noutra.
  if(isNew && recorrente === 'Sim'){
    payload.p_recorrente_inicial = true;
    payload.p_recorrencia_tipo_id = recorrenciaTipoId;
    payload.p_recorrencia_data_inicio = recorrenciaDataInicio;
    payload.p_recorrencia_proximo_retorno = recorrenciaProximoRetorno;
    payload.p_recorrencia_responsavel_id = refsBase.responsaveisPorNome[recorrenciaResponsavelNome] || null;
  }

  const btnSalvar = form.querySelector('[data-btn-salvar]');
  const textoOriginalBtn = btnSalvar ? btnSalvar.textContent : '';
  if(btnSalvar){ btnSalvar.disabled = true; btnSalvar.textContent = 'Salvando…'; }

  const nomeFuncao = isNew ? 'criar_paciente_com_procedimentos' : 'atualizar_paciente_com_procedimentos';
  const { data, error } = await window.moriSupabase.rpc(nomeFuncao, payload);

  if(error){
    console.error(`Falha ao chamar ${nomeFuncao}.`, error);
    toast('Não foi possível salvar o paciente. Tente novamente.');
    if(btnSalvar){ btnSalvar.disabled = false; btnSalvar.textContent = textoOriginalBtn; }
    return;
  }

  // [Requisito 7] Mesmo mapeamento Supabase → CRM do carregamento inicial —
  // só sobrepõe procedimentosPorPaciente deste paciente com o que acabou de
  // ser enviado à RPC (a view pacientes_com_status não traz os vínculos).
  const refsComProcedimentos = {
    ...refsBase,
    procedimentosPorPaciente: { ...refsBase.procedimentosPorPaciente, [data.id]: procedimentosSelecionados },
  };
  const pacienteAtualizado = mapPacienteSupabaseParaCRM(data, refsComProcedimentos);
  const idx = DB.pacientes.findIndex(x=>x.id===pacienteAtualizado.id);
  if(idx>=0) DB.pacientes[idx] = pacienteAtualizado; else DB.pacientes.push(pacienteAtualizado);

  // [Recorrência] Novo Paciente + recorrente=Sim: o ciclo foi criado
  // ATOMICAMENTE pela mesma chamada acima (criar_paciente_com_procedimentos),
  // mas o cache local DB.ciclosRecorrencia só sabe disso depois de recarregar
  // — sem isso, cicloAtivoDoPaciente() não encontraria o ciclo recém-criado
  // até o próximo reload completo da página.
  if(isNew && recorrente === 'Sim'){
    await recarregarCiclosRecorrenciaSupabase();
  }

  // [Recorrência — item 21] Paciente EXISTENTE sem ciclo ativo + recorrente=Sim:
  // chamada SEPARADA (iniciar_ciclo_recorrencia), depois do paciente já
  // salvo com sucesso — não atomiza com a edição geral do paciente (decisão
  // já aprovada). Importante: um erro aqui é SÓ da recorrência — o
  // paciente já foi salvo, a mensagem nunca pode sugerir o contrário.
  if(!isNew && recorrente === 'Sim'){
    const resultadoCiclo = await iniciarCicloRecorrencia({
      pacienteId: pacienteAtualizado.id,
      tipoId: recorrenciaTipoId,
      dataInicio: recorrenciaDataInicio,
      proximoRetorno: recorrenciaProximoRetorno,
      responsavelId: refsBase.responsaveisPorNome[recorrenciaResponsavelNome] || null,
    });
    if(!resultadoCiclo.ok){
      closeModal();
      render();
      toast('Paciente salvo, mas não foi possível iniciar a recorrência. Edite o paciente novamente para tentar.');
      return;
    }
  }

  closeModal();
  render();
  toast(isNew ? 'Paciente cadastrado.' : 'Paciente atualizado.');
}

/* ============================================================
   6) KANBAN
   ============================================================ */
function renderKanban(){
  const grupos = {};

    const s = calcStatus(p);
    if(grupos[s]) grupos[s].push(p);
  });
  return `<div class="kanban-wrap">
    ${ETAPAS_PADRAO.map(et=>{
      const items = grupos[et.nome]||[];
      return `<div class="kanban-col">
        <div class="kanban-col-head" style="background:${et.cor}">
          <span>${escapeHtml(et.nome)}</span><span>${items.length}</span>
        </div>
        <div class="kanban-col-body">
          ${items.length? items.map(p=>{
            // [V2] resgate de perdidos — regra: data_perda + 30 dias = elegível.
            // data_perda vem do Supabase quando preenchida; ver infoResgate()
            // e obterDataPerdaComFallbackLegado() para o fallback histórico.
            const resgate = et.nome==='Perdido' ? infoResgate(p) : null;
            // [V2.1] resgate realizado — abrir o WhatsApp sozinho NÃO conclui;
            // precisa da confirmação explícita da secretária.
            const resgateFeito = et.nome==='Perdido' ? acaoComercialConcluida('resgate', p.id) : null;
            // [Simplificação visual] mesma regra de valor de sempre, só que
            // agora omitida quando não há nenhum valor real — antes sempre
            // aparecia "💰 —", um dos itens de peso visual sem informação.
            const valor = p.fechouTratamento ? (p.valorFechado ?? p.valorOrcamento) : p.valorOrcamento;
            const respProc = [p.responsavel, (p.procedimentos||[]).join(', ')].filter(Boolean).join(' · ');
            return `
            <div class="kcard" data-open="${p.id}">
              <div class="nm">${escapeHtml(p.nome)}</div>
              ${respProc? `<div class="meta">${escapeHtml(respProc)}</div>` : ''}
              ${(valor!==null && valor!==undefined)? `<div class="kcard-valor">${fmtMoeda(valor)}</div>` : ''}
              ${resgate? `
                <div class="meta">${resgate.dias!==null? `Perdido há ${resgate.dias} dia${resgate.dias===1?'':'s'}` : 'Tempo de perda indisponível'}</div>
                ${p.motivoPerda? `<div class="meta">${escapeHtml(p.motivoPerda)}</div>` : ''}

/* ============================================================
   [V2.1] CLASSIFICAÇÃO TEMPORÁRIA DE TIPO DE INDICADOR
   ------------------------------------------------------------
   O campo estruturado `tipo_indicador` (paciente | profissional | outro)
   AINDA NÃO EXISTE no modelo de dados — hoje só existe o texto livre
   `indicadoPor`, digitado pela secretária. Esta função classifica esse
   texto por palavras-chave SOMENTE para fins de demonstração nesta
   homologação. O texto original de `indicadoPor` nunca é alterado — a
   classificação é sempre calculada na hora, nunca gravada por cima do
   dado real.
   Quando o campo `tipo_indicador` existir de verdade (Supabase), esta
   função inteira deve ser removida e a classificação passa a vir direto
   da coluna, não de um palpite por texto.
   Retorna 'paciente' | 'profissional' | 'outro' | null (null = sem
   indicador registrado, não deve ser exibido como se fosse "Outros").
   ============================================================ */
function classificarTipoIndicador(nomeIndicador){
  const texto = (nomeIndicador||'').toLowerCase().trim();
  if(!texto) return null;
  if(/\bdr\.?\b|\bdra\.?\b|doutor|doutora/.test(texto)) return 'profissional';
  if(/paciente/.test(texto)) return 'paciente';
  return 'outro';
}

// [V2.1] Substitui o gráfico "De onde vêm as indicações" (que mostrava

// relacionamento (pacientes vs. rede de profissionais vs. outros).
function renderGraficoTipoIndicador(){
  const contagem = { paciente:0, profissional:0, outro:0 };

function mesesDisponiveis(){
  // Março/2026 em diante, como na planilha original; estende automaticamente
  // até o mês atual se os dados forem além.
  const inicio = new Date(2026,2,1); // Março/2026
  const hoje = new Date();
  const maisRecente = DB.pacientes.reduce((acc,p)=>{
    const d = p.dataContato && new Date(p.dataContato+'T00:00:00');
    return d && d>acc ? d : acc;
  }, hoje);
  const fim = maisRecente>hoje?maisRecente:hoje;
  const meses = [];
  let cursor = new Date(inicio);
  while(cursor<=fim){
    meses.push(cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0'));
    cursor.setMonth(cursor.getMonth()+1);
  }
  return meses;
}

function aggregateMonth(key){
  const novos = DB.pacientes.filter(p=>monthKey(p.dataContato)===key);
  const fechadosMes = DB.pacientes.filter(p=>monthKey(p.dataFechamento)===key && (p.fechouTratamento==='Sim'||p.fechouTratamento==='Parcial'));
  const valorTotal = fechadosMes.reduce((s,p)=>s+(p.valorFechado||0),0);
  const taxa = novos.length? fechadosMes.length/novos.length : 0;
  const ticket = fechadosMes.length? valorTotal/fechadosMes.length : 0;
  return {novos:novos.length, fechados:fechadosMes.length, taxa, valorTotal, ticket};
}

function funilTotais(mesFiltro){
  const base = DB.pacientes;
  const novos = base.length;
  const agendados = base.filter(p=>p.marcouConsulta==='Sim').length;
  const compareceram = base.filter(p=>p.compareceu==='Sim').length;
  const fechados = base.filter(p=>{ const s=calcStatus(p); return s==='Fechado (Total)'||s==='Fechado (Parcial)'; }).length;
  let noMes = {novos:0,agendados:0,compareceram:0,fechados:0};
  if(mesFiltro){
    noMes.novos = base.filter(p=>monthKey(p.dataContato)===mesFiltro).length;
    noMes.agendados = base.filter(p=>p.marcouConsulta==='Sim'&&monthKey(p.dataConsulta)===mesFiltro).length;
    noMes.compareceram = base.filter(p=>p.compareceu==='Sim'&&monthKey(p.dataConsulta)===mesFiltro).length;
    noMes.fechados = base.filter(p=>{ const s=calcStatus(p); return (s==='Fechado (Total)'||s==='Fechado (Parcial)')&&monthKey(p.dataFechamento)===mesFiltro; }).length;
  }
  return {novos,agendados,compareceram,fechados,noMes};
}

// [V2.1] Os 3 componentes abaixo aceitam um filtro de período opcional
// ('total' ou uma chave 'YYYY-MM' de mesesDisponiveis()). Sem filtro (ou
// 'total'), consideram a base inteira — igual ao comportamento original.
//
// IMPORTANTE (coorte, não "evento no mês"): diferente do restante do
// Dashboard (que já existia antes desta rodada e usa "o fechamento
// aconteceu neste mês"), aqui um mês filtra pela DATA DE ORIGEM do lead
// (1º contato) ou do comparecimento — e dentro desse grupo, olha se
// fechou depois, não importa quando. É a regra pedida especificamente
// para este bloco de Conversão; os indicadores mensais antigos (Resumo do
// mês / Evolução / Funil de Conversão já existente) NÃO mudaram.
function contagemPorOrigem(mesFiltro){
  const base = (mesFiltro && mesFiltro!=='total') ? DB.pacientes.filter(p=>monthKey(p.dataContato)===mesFiltro) : DB.pacientes;
  const mapa = {};
  base.forEach(p=>{ const k=p.origem||'Não informado'; mapa[k]=(mapa[k]||0)+1; });
  return Object.entries(mapa).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({label,count}));
}
function contagemPorProcedimento(mesFiltro){
  const base = (mesFiltro && mesFiltro!=='total') ? DB.pacientes.filter(p=>monthKey(p.dataContato)===mesFiltro) : DB.pacientes;
  const mapa = {};
  base.forEach(p=>{ (p.procedimentos||[]).forEach(proc=>{ mapa[proc]=(mapa[proc]||0)+1; }); });
  return Object.entries(mapa).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({label,count}));
}
function calcularFunilDuplo(mesFiltro){
  const filtrar = mesFiltro && mesFiltro!=='total';
  const cohortLeads = filtrar ? DB.pacientes.filter(p=>monthKey(p.dataContato)===mesFiltro) : DB.pacientes;
  const cohortCompareceram = filtrar
    ? DB.pacientes.filter(p=>p.compareceu==='Sim' && monthKey(p.dataConsulta)===mesFiltro)
    : DB.pacientes.filter(p=>p.compareceu==='Sim');
  const novosLeads = cohortLeads.length;
  const vendidos = cohortLeads.filter(isVendido).length;
  const compareceram = cohortCompareceram.length;
  const vendidosCompareceram = cohortCompareceram.filter(isVendido).length;
  return {
    novosLeads, vendidos, compareceram, vendidosCompareceram,
    taxa1: novosLeads? vendidos/novosLeads : 0,
    taxa2: compareceram? vendidosCompareceram/compareceram : 0,
  };
}

/* ============================================================
   9) AGENDA — urgência (heurística: ver Contexto/README sobre limitação)
   ============================================================ */
function calcUrgencia(p){
  const status = calcStatus(p);
  const hoje = hojeISO();
  let dias = null, texto = '';
  if(status==='Novo Paciente'){
    dias = diasEntre(p.dataContato, hoje);
    texto = 'Fazer 1º contato / agendar consulta';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=3?'atrasado':(dias>=1?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Consulta Marcada'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = dias!==null && dias>0 ? 'Registrar resultado da consulta (compareceu?)' : 'Confirmar presença na consulta';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>0?'atrasado':(dias>=-1?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Não Compareceu'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = 'Tentar reagendar consulta';
    return {nivel:'atrasado', texto, dias};
  }
  if(status==='Compareceu'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = 'Follow-up: apresentar plano/orçamento';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=5?'atrasado':(dias>=2?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Plano de Tratamento'){
    dias = diasEntre(p.dataConsulta, hoje);
    texto = 'Follow-up: fechar tratamento';
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=5?'atrasado':(dias>=2?'proximo':'em-dia'), texto, dias};
  }
  if(status==='Pendente'){
    const ref = p.dataFechamento || p.dataConsulta || p.dataContato;
    dias = diasEntre(ref, hoje);
    texto = 'Retomar contato — decisão pendente'+(p.observacoes?`: ${p.observacoes}`:'');
    if(dias===null) return {nivel:'proximo', texto, dias:null};
    return {nivel: dias>=5?'atrasado':(dias>=2?'proximo':'em-dia'), texto, dias};
  }
  return null;
}

  while(celulas.length % 7 !== 0) celulas.push(null);

  const consultasDoDia = agendaDiaSelecionado ? (porDia[agendaDiaSelecionado]||[]) : [];

  return `
