<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Projeto</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
<style>
/* ============ CSS_BASE ============ */
:root{
  --bg:#f5f6f9; --bg-elevated:#ffffff; --bg-soft:#f0f1f5; --border:#e4e6eb;
  --text:#1c2029; --text-muted:#68707e; --text-faint:#98a0ac;
  --primary:#5b5bf6; --primary-hover:#4747dd; --primary-soft:#eef0ff;
  --success:#22c55e; --success-soft:#e8f9ef; --warning:#f59e0b; --warning-soft:#fff6e6;
  --danger:#ef4444; --danger-soft:#fdeceb; --info:#06b6d4; --info-soft:#e7fbff;
  --radius:10px; --radius-lg:16px; --shadow-sm:0 1px 2px rgba(15,23,42,.07);
  --shadow-md:0 6px 20px rgba(15,23,42,.10); --sidebar-w:236px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#111318; --bg-elevated:#1a1c23; --bg-soft:#20232c; --border:#2b2e38;
  --text:#eef0f5; --text-muted:#9aa1b0; --text-faint:#6c7280;
  --primary:#8080fb; --primary-hover:#9999ff; --primary-soft:#242642;
  --success:#34d399; --success-soft:#122a20; --warning:#fbbf24; --warning-soft:#2b2210;
  --danger:#f87171; --danger-soft:#301616; --info:#22d3ee; --info-soft:#0d2830;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 24px rgba(0,0,0,.45);
}
/* Segue o tema do sistema quando o usuário não escolheu manualmente claro/escuro no app */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --bg-elevated:#1a1c23; --bg-soft:#20232c; --border:#2b2e38;
    --text:#eef0f5; --text-muted:#9aa1b0; --text-faint:#6c7280;
    --primary:#8080fb; --primary-hover:#9999ff; --primary-soft:#242642;
    --success:#34d399; --success-soft:#122a20; --warning:#fbbf24; --warning-soft:#2b2210;
    --danger:#f87171; --danger-soft:#301616; --info:#22d3ee; --info-soft:#0d2830;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 24px rgba(0,0,0,.45);
  }
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--primary);}
h1,h2,h3,h4,p{margin:0;}
ul{list-style:none;margin:0;padding:0;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{width:var(--sidebar-w);flex:0 0 auto;background:var(--bg-elevated);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:60;transition:transform .2s ease;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;}
.sidebar-brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#9b8bff);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex:0 0 auto;}
.sidebar-brand .name{font-weight:700;font-size:15px;letter-spacing:.2px;}
.sidebar-brand .name small{display:block;font-weight:500;color:var(--text-faint);font-size:11px;}
.nav-list{flex:1;padding:6px 10px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--text-muted);cursor:pointer;font-weight:600;font-size:13.5px;margin-bottom:2px;user-select:none;}
.nav-item svg{width:17px;height:17px;flex:0 0 auto;}
.nav-item:hover{background:var(--bg-soft);color:var(--text);}
.nav-item.active{background:var(--primary-soft);color:var(--primary);}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;background:var(--bg-soft);font-size:12.5px;font-weight:600;color:var(--text-muted);}
.sidebar-close{display:none;}

/* ---------- Main / Topbar ---------- */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.topbar .hamburger{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer;}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.2px;}
.topbar .spacer{flex:1;}
.search-box{position:relative;min-width:220px;}
.search-box input[type="search"]{width:100%;padding:8px 12px 8px 32px;border-radius:9px;border:1px solid var(--border);background:var(--bg-elevated);}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
.view{display:none;padding:22px 26px 90px;max-width:1500px;}
.view.active{display:block;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-elevated);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:.12s;}
.btn svg{width:15px;height:15px;}
.btn:hover{background:var(--bg-soft);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--bg-soft);}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:7px;}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.fab{position:fixed;right:28px;bottom:28px;z-index:50;padding:13px 20px;border-radius:30px;background:var(--primary);
  color:#fff;border:none;font-weight:700;font-size:14px;box-shadow:var(--shadow-md);cursor:pointer;display:flex;align-items:center;gap:8px;}
.fab:hover{background:var(--primary-hover);}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;background:var(--bg-soft);color:var(--text-muted);font-size:11px;font-weight:600;margin:1px;}

/* ---------- Cards / grid ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);}
.stat-card .lbl{font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
.stat-card .val{font-size:26px;font-weight:800;margin-top:6px;}
.stat-card .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:15px;font-weight:800;}
.panel-head .hint{font-size:11.5px;color:var(--text-faint);font-weight:600;}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
.dash-grid .col{min-width:0;}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr;}}

/* ---------- Progress bar ---------- */
.progress{height:8px;border-radius:6px;background:var(--bg-soft);overflow:hidden;}
.progress > span{display:block;height:100%;border-radius:6px;background:var(--primary);transition:width .3s;}
.progress-lg{height:12px;}
.progress-row{display:flex;align-items:center;gap:10px;}
.progress-row .progress{flex:1;}
.progress-row .pct{font-size:12px;font-weight:700;color:var(--text-muted);width:36px;text-align:right;}

/* ---------- Forms ---------- */
.form-group{margin-bottom:13px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=url],select,textarea{
  width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);}
textarea{resize:vertical;min-height:64px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary);}
input[type=color]{width:38px;height:32px;padding:2px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--bg-elevated);}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,17,25,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:32px 14px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--bg-elevated);border-radius:var(--radius-lg);width:100%;max-width:600px;box-shadow:var(--shadow-md);margin:auto;}
.modal.modal-sm{max-width:400px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;font-weight:800;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-faint);width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--bg-soft);}
fieldset{border:1px solid var(--border);border-radius:10px;padding:12px;margin:0 0 13px;}
legend{font-size:12px;font-weight:800;padding:0 6px;color:var(--text-muted);}
.checklist-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.checklist-item span{flex:1;font-size:13px;}
.checklist-item.done span{text-decoration:line-through;color:var(--text-faint);}
.dep-list{max-height:130px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;}
.dep-list label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text);margin-bottom:4px;font-size:12.5px;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-elevated);}
table{width:100%;border-collapse:collapse;min-width:920px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg-soft);}
.phase-row td{background:var(--bg-soft);font-weight:800;padding:9px 12px;font-size:12.5px;}
.phase-row .ph-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;}
.row-overdue{box-shadow:inset 3px 0 0 var(--danger);}
.row-duesoon{box-shadow:inset 3px 0 0 var(--warning);}
.row-done td{color:var(--text-faint);}
.task-name-cell{display:flex;align-items:center;gap:7px;font-weight:700;cursor:pointer;}
.star-btn{background:none;border:none;cursor:pointer;color:var(--text-faint);padding:0;display:flex;}
.star-btn.active{color:var(--warning);}
.actions-cell{display:flex;gap:4px;}
.mini-select{width:auto;min-width:128px;padding:4px 6px;font-size:11.5px;border-radius:6px;}

/* ---------- Filters ---------- */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.filter-bar select,.filter-bar input[type=date]{width:auto;padding:6px 8px;font-size:12px;}
.phase-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.phase-chip{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer;min-width:150px;}
.phase-chip.collapsed{opacity:.55;}
.phase-chip .ph-name{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;margin-bottom:6px;}

/* ---------- Kanban ---------- */
.kanban-wrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex:0 0 270px;background:var(--bg-soft);border-radius:var(--radius-lg);padding:10px;min-height:200px;}
.kanban-col.dragover{outline:2px dashed var(--primary);outline-offset:-2px;}
.kanban-col h4{font-size:12.5px;font-weight:800;padding:6px 6px 10px;display:flex;justify-content:space-between;align-items:center;}
.kcard{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow-sm);}
.kcard.dragging{opacity:.4;}
.kcard .kc-title{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between;}
.kcard .kc-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:11px;}
.kcard .kc-due{font-size:11px;font-weight:700;color:var(--text-muted);margin-top:6px;}

/* ---------- Gantt ---------- */
.gantt-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-elevated);}
.gantt-row{display:flex;border-bottom:1px solid var(--border);min-width:1000px;}
.gantt-row:last-child{border-bottom:none;}
.gantt-label{flex:0 0 260px;padding:8px 12px;font-size:12.5px;border-right:1px solid var(--border);position:sticky;left:0;background:var(--bg-elevated);z-index:2;}
.gantt-label .g-sub{color:var(--text-faint);font-size:10.5px;font-weight:600;}
.gantt-track{flex:1;position:relative;padding:8px 0;min-height:36px;}
.gantt-bar{position:absolute;height:16px;border-radius:6px;top:10px;font-size:10px;color:#fff;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;font-weight:700;}
.gantt-header{display:flex;min-width:1000px;background:var(--bg-soft);position:sticky;top:0;z-index:3;}
.gantt-header .gantt-label{background:var(--bg-soft);}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:1;}
.gantt-phase-head{background:var(--bg-soft);font-weight:800;padding:8px 12px;font-size:12.5px;min-width:1000px;}

/* ---------- Calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.cal-nav h3{font-size:15px;font-weight:800;min-width:170px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:11px;font-weight:800;color:var(--text-faint);text-align:center;padding:4px;text-transform:uppercase;}
.cal-cell{min-height:96px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:6px;font-size:11px;}
.cal-cell.other-month{opacity:.4;}
.cal-cell.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
.cal-daynum{font-weight:800;margin-bottom:4px;}
.cal-chip{background:var(--bg-soft);border-radius:6px;padding:2px 5px;margin-bottom:3px;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- Ideas ---------- */
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.idea-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;}
.idea-card h4{font-size:14px;font-weight:800;}
.idea-card p{font-size:12.5px;color:var(--text-muted);flex:1;}
.idea-card .idea-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}

/* ---------- Metas do Ano ---------- */
.goals-board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.goals-col h4{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--border);}
.goal-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px;box-shadow:var(--shadow-sm);margin-bottom:12px;}
.goal-card.goal-overdue{box-shadow:inset 3px 0 0 var(--danger);}
.goal-card.goal-done{opacity:.75;}
.goal-card .goal-title{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;}
.goal-card p{font-size:12px;color:var(--text-muted);margin:6px 0;}
.goal-dates{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);font-weight:600;margin-bottom:10px;}
.goal-actions{display:flex;gap:6px;flex-wrap:wrap;}
@media(max-width:900px){.goals-board{grid-template-columns:1fr;}}

/* ---------- Central de Leads (planilha) ---------- */
.leads-table{min-width:1180px;}
td.lead-cell{padding:3px 5px;}
.cell-input{width:100%;min-width:112px;border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:6px;}
.cell-input:hover{border-color:var(--border);}
.cell-input:focus{border-color:var(--primary);background:var(--bg-elevated);outline:none;}
.cell-input.cell-overdue{color:var(--danger);font-weight:700;}
tr.row-lost td{color:var(--text-faint);}
tr.row-lost .cell-input{text-decoration:line-through;}

/* ---------- History ---------- */
.hist-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-time{width:130px;flex:0 0 auto;color:var(--text-faint);font-size:11.5px;font-weight:700;}
.hist-icon{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}

/* ---------- Alerts ---------- */
.alert-list{display:flex;flex-direction:column;gap:8px;}
.alert-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:700;}
.alert-item .count{margin-left:auto;font-size:14px;font-weight:800;}

/* ---------- Toast ---------- */
#toast-container{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:var(--bg-elevated);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);opacity:0;transform:translateY(8px);transition:.2s;}
.toast.show{opacity:1;transform:translateY(0);}

/* ---------- Attention today ---------- */
.attn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.attn-card{border-radius:12px;padding:12px;border:1px solid var(--border);background:var(--bg-elevated);}
.attn-card .attn-title{font-weight:800;font-size:13px;margin-bottom:6px;}

.empty-state{text-align:center;padding:36px 14px;color:var(--text-faint);font-size:13px;font-weight:600;}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .topbar .hamburger{display:flex;}
  .form-row{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
  .fab{padding:0;width:52px;height:52px;border-radius:50%;justify-content:center;}
  .fab span{display:none;}
}
.overlay-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none;}
.overlay-scrim.open{display:block;}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.fab,#toast-container,.filter-bar,.actions-cell,.overlay-scrim,.no-print{display:none!important;}
  .main{margin-left:0!important;}
  .view{display:none!important;padding:0!important;}
  .view.printing{display:block!important;}
  body{background:#fff;}
  .panel,.table-wrap,.gantt-scroll{box-shadow:none;border-color:#ccc;}
  .table-wrap,.gantt-scroll,.kanban-wrap{overflow:visible!important;}
  table{min-width:0!important;}
}


</style>
</head>
<body>
<div class="overlay-scrim" id="scrim" onclick="closeSidebar()"></div>
<div class="app">
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">🗂️</div>
      <div class="name">Painel do Projeto<small>Gestão &amp; Cronograma</small></div>
    </div>
    <ul class="nav-list" id="navList">

    </ul>

/* ---------------------------------------------------------------------
   2. UTILITÁRIOS
--------------------------------------------------------------------- */
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toDate(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function fmtBR(iso){ if(!iso) return '—'; const d=toDate(iso); return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); }
function daysBetween(isoA,isoB){ const a=toDate(isoA), b=toDate(isoB); if(!a||!b) return 0; return Math.round((b-a)/86400000); }
function addDays(iso,n){ const d=toDate(iso); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2list(text){ return (text||'').split(/\n|,/).map(s=>s.trim()).filter(Boolean); }

function findCatByName(name){ return state.categories.find(c=>c.name===name); }
function findPhaseByName(name){ return state.phases.find(p=>p.name===name); }

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); return normalizeState(parsed); }
  }catch(e){ console.warn('Falha ao carregar estado salvo, iniciando novo.', e); }
  const st = defaultState();
  seedDemoData(st);
  return st;
}
function normalizeState(parsed){
  const base = defaultState();
  const merged = Object.assign({}, base, parsed);
  merged.project = Object.assign({}, base.project, parsed.project||{});
  merged.settings = Object.assign({}, base.settings, parsed.settings||{});
  merged.leadsGoal = Object.assign({}, base.leadsGoal, parsed.leadsGoal||{});
  merged.phases = Array.isArray(parsed.phases)&&parsed.phases.length ? parsed.phases : base.phases;
  merged.categories = Array.isArray(parsed.categories)&&parsed.categories.length ? parsed.categories : base.categories;
  merged.tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
  merged.ideas = Array.isArray(parsed.ideas) ? parsed.ideas : [];
  merged.goals = Array.isArray(parsed.goals) ? parsed.goals : [];
  merged.leads = Array.isArray(parsed.leads) ? parsed.leads : [];
  merged.history = Array.isArray(parsed.history) ? parsed.history : [];
  return merged;
}

}

   5. HELPERS DERIVADOS
--------------------------------------------------------------------- */
function getTask(id){ return state.tasks.find(t=>t.id===id); }
function getPhase(id){ return state.phases.find(p=>p.id===id); }
function getCategory(id){ return state.categories.find(c=>c.id===id); }

function taskPercent(t){
  if(t.status==='Concluído') return 100;
  if(t.checklist && t.checklist.length){
    const done = t.checklist.filter(c=>c.done).length;
    return Math.round(done/t.checklist.length*100);
  }
  return clamp(t.percent||0,0,100);
}
function isFinished(t){ return t.status==='Concluído' || t.status==='Cancelado'; }
function isOverdue(t){ return !isFinished(t) && t.dueDate && t.dueDate < todayISO(); }
function isDueToday(t){ return !isFinished(t) && t.dueDate === todayISO(); }
function isDueWithin(t,days){ return !isFinished(t) && t.dueDate && t.dueDate>=todayISO() && daysBetween(todayISO(),t.dueDate)<=days; }
function isBlocked(t){ return (t.dependencies||[]).some(id=>{ const d=getTask(id); return d && d.status!=='Concluído'; }); }
function blockedByNames(t){ return (t.dependencies||[]).map(id=>getTask(id)).filter(d=>d && d.status!=='Concluído').map(d=>d.name); }

/* Pontuação usada em "Próximas ações" / "Atenção hoje": quanto maior, mais urgente */
function taskScore(t){
  if(isFinished(t)) return -9999;
  let score = 0;
  if(isOverdue(t)) score += 1000 + Math.min(60, -daysBetween(todayISO(),t.dueDate))*2;
  else if(t.dueDate){ const dleft = daysBetween(todayISO(),t.dueDate); score += Math.max(0, 200 - dleft*6); }
  score += {Baixa:0,Média:15,Alta:35,Urgente:60}[t.priority]||0;
  score += (t.importance||1)*12;
  if(t.status==='Em andamento') score += 10;
  if(t.status==='Não iniciado') score += 4;
  if(t.favorite) score += 8;
  return score;
}

function getFilteredTasks(){
  const s = filters.search.trim().toLowerCase();
  return state.tasks.filter(t=>{
    if(filters.status && t.status!==filters.status) return false;
    if(filters.priority && t.priority!==filters.priority) return false;
    if(filters.importance && String(t.importance)!==String(filters.importance)) return false;
    if(filters.category && t.category!==filters.category) return false;
    if(filters.phase && t.phase!==filters.phase) return false;
    if(filters.owner && t.owner!==filters.owner) return false;
    if(filters.dateFrom && (!t.dueDate || t.dueDate<filters.dateFrom)) return false;
    if(filters.dateTo && (!t.dueDate || t.dueDate>filters.dateTo)) return false;
    if(filters.onlyOverdue && !isOverdue(t)) return false;
    if(filters.onlyCompleted && t.status!=='Concluído') return false;
    if(filters.onlyFavorite && !t.favorite) return false;
    if(s){
      const hay = (t.name+' '+t.description+' '+(t.tags||[]).join(' ')+' '+t.owner).toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

  filters = {status:'',priority:'',importance:'',category:'',phase:'',owner:'',dateFrom:'',dateTo:'',onlyOverdue:false,onlyCompleted:false,onlyFavorite:false,search:filters.search};

  if(isDueWithin(t,3)) return `<span style="color:var(--warning);font-weight:800">${fmtBR(t.dueDate)}</span>`;

}

function computeStats(){
  const tasks = state.tasks;
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==='Concluído').length;
  const doing = tasks.filter(t=>t.status==='Em andamento').length;
  const overdue = tasks.filter(isOverdue).length;
  const notStarted = tasks.filter(t=>t.status==='Não iniciado' || t.status==='Ideia').length;
  const urgent = tasks.filter(t=>t.priority==='Urgente' && !isFinished(t)).length;
  const overallPct = total? Math.round(tasks.reduce((s,t)=>s+taskPercent(t),0)/total) : 0;
  return {total,done,doing,overdue,notStarted,urgent,overallPct};
}

function togglePhaseCollapse(id){ const ph=getPhase(id); ph.collapsed=!ph.collapsed; save(); renderCurrentView(); }

function setSort(field){
  if(sortState.field===field) sortState.dir = sortState.dir==='asc'?'desc':'asc';
  else { sortState.field=field; sortState.dir='asc'; }
  renderCurrentView();
}
function sortTasks(list){
  const f=sortState.field, dir=sortState.dir==='asc'?1:-1;
  return list.slice().sort((a,b)=>{
    let av,bv;
    if(f==='percent'){ av=taskPercent(a); bv=taskPercent(b); }
    else if(f==='category'){ av=(getCategory(a.category)||{}).name||''; bv=(getCategory(b.category)||{}).name||''; }
    else { av=a[f]||''; bv=b[f]||''; }
    if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
  });
}

function renderTaskTableBody(){
  const filtered = getFilteredTasks();
  let html = '';
  const grouped = state.phases.slice().sort((a,b)=>a.order-b.order);
  grouped.forEach(ph=>{
    const ts = sortTasks(filtered.filter(t=>t.phase===ph.id));
    if(!ts.length && (filters.phase && filters.phase!==ph.id)) return;
    const allTs = state.tasks.filter(t=>t.phase===ph.id);
    const done = allTs.filter(t=>t.status==='Concluído').length;
    const pct = allTs.length? Math.round(allTs.reduce((s,t)=>s+taskPercent(t),0)/allTs.length):0;
    html += `<tr class="phase-row"><td colspan="11">
      <div class="ph-toggle" onclick="togglePhaseCollapse('${ph.id}')">
        ${svgIcon('chevDown',`style="width:14px;height:14px;transform:rotate(${ph.collapsed?'-90deg':'0deg'})"`)}
        <span>${escapeHtml(ph.name)}</span>
        <span style="color:var(--text-muted);font-weight:600">${allTs.length} tarefas · ${done} concluídas · ${pct}%</span>
      </div></td></tr>`;
    if(!ph.collapsed){
      if(!ts.length) html += `<tr><td colspan="11"><div class="empty-state">Nenhuma tarefa nesta fase com os filtros atuais.</div></td></tr>`;
      ts.forEach(t=> html += taskTableRow(t));
    }
  });
  const noPhaseTasks = sortTasks(filtered.filter(t=>!getPhase(t.phase)));
  if(noPhaseTasks.length){
    html += `<tr class="phase-row"><td colspan="11">Sem fase</td></tr>`;
    noPhaseTasks.forEach(t=> html += taskTableRow(t));
  }
  if(!filtered.length) html += `<tr><td colspan="11"><div class="empty-state">Nenhuma tarefa encontrada. Ajuste os filtros ou crie uma nova tarefa.</div></td></tr>`;
  return html;
}

function taskTableRow(t){
  return `<tr class="${taskRowClasses(t)}">
    <td><button class="star-btn ${t.favorite?'active':''}" onclick="toggleFavorite('${t.id}')">${svgIcon('star')}</button></td>
    <td><div class="task-name-cell" onclick="openTaskModal('${t.id}')">
        ${t.status==='Concluído'?`<span style="color:var(--success)">${svgIcon('check',`style="width:15px;height:15px"`)}</span>`:''}
        ${escapeHtml(t.name)} ${isBlocked(t)?`<span title="Bloqueada por: ${escapeHtml(blockedByNames(t).join(', '))}">${svgIcon('lock',`style="width:13px;height:13px;color:var(--warning)"`)}</span>`:''}
      </div>
      ${t.tags&&t.tags.length? `<div>${t.tags.map(tg=>`<span class="tag">#${escapeHtml(tg)}</span>`).join('')}</div>`:''}
    </td>
    <td>${categoryBadge(t.category)}</td>
    <td><select class="mini-select" onchange="quickChangeStatus('${t.id}',this.value)">${selectOptions(STATUS_LIST.map(s=>({id:s,name:s})), t.status)}</select></td>
    <td><select class="mini-select" onchange="quickChangePriority('${t.id}',this.value)">${selectOptions(PRIORITY_LIST.map(p=>({id:p,name:p})), t.priority)}</select></td>
    <td>${importanceBadge(t.importance)}</td>
    <td>${taskProgressMini(t)}</td>
    <td>${fmtBR(t.startDate)}</td>
    <td>${dueLabel(t)}</td>
    <td>${escapeHtml(t.owner)||'—'}</td>
    <td class="actions-cell">
      ${t.status==='Concluído'
        ? `<button class="btn btn-icon btn-ghost" title="Reabrir" onclick="reopenTask('${t.id}')">${svgIcon('undo')}</button>`
        : `<button class="btn btn-icon btn-ghost" title="Concluir" onclick="completeTask('${t.id}')">${svgIcon('check')}</button>`}
      <button class="btn btn-icon btn-ghost" title="Editar" onclick="openTaskModal('${t.id}')">${svgIcon('edit')}</button>
      <button class="btn btn-icon btn-ghost" title="Duplicar" onclick="duplicateTask('${t.id}')">${svgIcon('copy')}</button>

/* ---------------------------------------------------------------------
   12. AÇÕES RÁPIDAS SOBRE TAREFAS — #3
--------------------------------------------------------------------- */
function toggleFavorite(id){ const t=getTask(id); if(!t) return; t.favorite=!t.favorite; t.updatedAt=new Date().toISOString(); renderAll(); }

function completeTask(id){
  const t=getTask(id); if(!t) return;
  t.status='Concluído'; t.percent=100; t.completedAt=todayISO(); t.updatedAt=new Date().toISOString();
  if(t.checklist&&t.checklist.length) t.checklist.forEach(c=>c.done=true);
  addHistory('Tarefa concluída', t.name);
  renderAll(); toast('Tarefa marcada como concluída ✅');
}
function reopenTask(id){
  const t=getTask(id); if(!t) return;
  t.status='Em andamento'; t.completedAt=null; t.updatedAt=new Date().toISOString();
  addHistory('Mudança de status', t.name, 'Reaberta (Concluído → Em andamento)');
  renderAll(); toast('Tarefa reaberta');
}
function quickChangeStatus(id, newStatus){
  const t=getTask(id); if(!t) return;
  const old = t.status; t.status = newStatus; t.updatedAt=new Date().toISOString();
  if(newStatus==='Concluído'){ t.percent=100; t.completedAt=todayISO(); if(t.checklist) t.checklist.forEach(c=>c.done=true); }
  else if(old==='Concluído'){ t.completedAt=null; }
  addHistory('Mudança de status', t.name, `${old} → ${newStatus}`);
  renderAll();
}
function quickChangePriority(id, newPriority){
  const t=getTask(id); if(!t) return;
  const old=t.priority; t.priority=newPriority; t.updatedAt=new Date().toISOString();
  addHistory('Tarefa editada', t.name, `Prioridade: ${old} → ${newPriority}`);
  renderAll();
}
function duplicateTask(id){
  const t=getTask(id); if(!t) return;
  const copy = JSON.parse(JSON.stringify(t));
  copy.id = uid('t'); copy.name = t.name+' (cópia)'; copy.status='Não iniciado'; copy.percent=0; copy.completedAt=null;
  copy.checklist = (t.checklist||[]).map(c=>({id:uid('c'),text:c.text,done:false}));
  copy.createdAt = new Date().toISOString(); copy.updatedAt = copy.createdAt; copy.isDemo=false;
  state.tasks.push(copy);
  addHistory('Tarefa criada', copy.name, 'Duplicada de "'+t.name+'"');
  renderAll(); toast('Tarefa duplicada');
}
function deleteTask(id){
  const t=getTask(id); if(!t) return;
  confirmAction(`Excluir a tarefa "${t.name}"? Essa ação não pode ser desfeita.`, ()=>{
    state.tasks = state.tasks.filter(x=>x.id!==id);
    state.tasks.forEach(x=>{ x.dependencies = (x.dependencies||[]).filter(d=>d!==id); });
    addHistory('Tarefa excluída', t.name);
    renderAll(); toast('Tarefa excluída', 'warn');
  }, 'Excluir tarefa');
}

      </div>

function renderChecklistItems(){
  if(!tempChecklist.length) return '<div style="font-size:12px;color:var(--text-faint)">Nenhum item ainda.</div>';
  return tempChecklist.map((c,i)=>`
    <div class="checklist-item ${c.done?'done':''}">
      <input type="checkbox" ${c.done?'checked':''} onchange="tempChecklist[${i}].done=this.checked;refreshChecklist()">
      <span>${escapeHtml(c.text)}</span>
      <button type="button" class="btn btn-icon btn-ghost btn-sm" onclick="tempChecklist.splice(${i},1);refreshChecklist()">${svgIcon('x')}</button>
    </div>`).join('');
}
function refreshChecklist(){
  document.getElementById('checklistBox').innerHTML = renderChecklistItems();
  const pctInput = document.getElementById('f_percent');
  if(pctInput){
    if(tempChecklist.length){ pctInput.disabled=true; pctInput.value = Math.round(tempChecklist.filter(c=>c.done).length/tempChecklist.length*100); }
    else pctInput.disabled=false;
  }
}
function addChecklistItem(){
  const inp = document.getElementById('newChecklistText');
  const v = inp.value.trim(); if(!v) return;
  tempChecklist.push({id:uid('c'), text:v, done:false});
  inp.value=''; refreshChecklist();
}
function renderDepOptions(){
  const others = state.tasks.filter(t=>t.id!==editingTaskId);
  if(!others.length) return '<div style="font-size:12px;color:var(--text-faint)">Nenhuma outra tarefa cadastrada.</div>';
  return others.map(t=>`
    <label><input type="checkbox" value="${t.id}" ${tempDeps.includes(t.id)?'checked':''} onchange="toggleDep('${t.id}',this.checked)"> ${escapeHtml(t.name)} ${statusBadge(t.status)}</label>`).join('');
}
function toggleDep(id, checked){ if(checked){ if(!tempDeps.includes(id)) tempDeps.push(id); } else { tempDeps = tempDeps.filter(d=>d!==id); } }

function saveTaskFromModal(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Informe o nome da tarefa', 'error'); return; }
  const status = document.getElementById('f_status').value;
  const isNew = !editingTaskId;
  const t = isNew ? {id:uid('t'), createdAt:new Date().toISOString(), isDemo:false, completedAt:null} : getTask(editingTaskId);
  const prevStatus = t.status;

  t.name = name;
  t.description = document.getElementById('f_description').value.trim();
  t.category = document.getElementById('f_category').value;
  t.phase = document.getElementById('f_phase').value;
  t.startDate = document.getElementById('f_startDate').value;
  t.dueDate = document.getElementById('f_dueDate').value;
  t.owner = document.getElementById('f_owner').value.trim();
  t.status = status;
  t.priority = document.getElementById('f_priority').value;
  t.importance = Number(document.getElementById('f_importance').value);
  t.tags = nl2list(document.getElementById('f_tags').value);
  t.links = document.getElementById('f_links').value.trim();
  t.notes = document.getElementById('f_notes').value.trim();
  t.favorite = document.getElementById('f_favorite').checked;
  t.checklist = tempChecklist.slice();
  t.dependencies = tempDeps.slice();
  t.percent = clamp(Number(document.getElementById('f_percent').value)||0, 0, 100);
  if(t.checklist.length) t.percent = Math.round(t.checklist.filter(c=>c.done).length/t.checklist.length*100);
  if(status==='Concluído'){ t.percent=100; if(!t.completedAt) t.completedAt=todayISO(); }
  else if(prevStatus==='Concluído' && status!=='Concluído'){ t.completedAt=null; }
  t.updatedAt = new Date().toISOString();

  if(isNew){ state.tasks.push(t); addHistory('Tarefa criada', t.name); toast('Tarefa criada'); }
  else { addHistory('Tarefa editada', t.name); toast('Tarefa atualizada'); }

  closeModal('modalTask');
  renderAll();
}

--------------------------------------------------------------------- */
function renderKanbanView(){
  const el = document.getElementById('view-kanban');
  const filtered = getFilteredTasks();
  el.innerHTML = `<div class="kanban-wrap">${STATUS_LIST.map(st=>{
    const ts = filtered.filter(t=>t.status===st);
    return `<div class="kanban-col" data-status="${st}" ondragover="kanbanDragOver(event)" ondragleave="kanbanDragLeave(event)" ondrop="kanbanDrop(event,'${st}')">
      <h4><span style="color:${STATUS_COLOR[st]}">● ${st}</span><span style="color:var(--text-faint)">${ts.length}</span></h4>
      ${ts.map(t=>kanbanCard(t)).join('') || '<div class="empty-state" style="padding:16px 4px">Sem tarefas</div>'}
    </div>`;
  }).join('')}</div>`;
}
function kanbanCard(t){
  return `<div class="kcard" draggable="true" data-id="${t.id}" ondragstart="kanbanDragStart(event,'${t.id}')" ondragend="kanbanDragEnd(event)" onclick="openTaskModal('${t.id}')">
    <div class="kc-title">
      <span>${escapeHtml(t.name)}</span>
      <button class="star-btn ${t.favorite?'active':''}" onclick="event.stopPropagation();toggleFavorite('${t.id}')">${svgIcon('star')}</button>
    </div>
    <div class="kc-meta">${categoryBadge(t.category)}${priorityBadge(t.priority)}${importanceBadge(t.importance)}</div>
    ${isBlocked(t)?`<div style="font-size:10.5px;color:var(--warning);margin-top:5px;display:flex;align-items:center;gap:4px">${svgIcon('lock',`style="width:11px;height:11px"`)} Bloqueada</div>`:''}
    ${taskProgressMini(t)}
    <div class="kc-due">${dueLabel(t)}</div>
  </div>`;
}
let dragTaskId = null;
function kanbanDragStart(ev,id){ dragTaskId=id; ev.target.classList.add('dragging'); ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain', id); }
function kanbanDragEnd(ev){ ev.target.classList.remove('dragging'); }
function kanbanDragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('dragover'); }
function kanbanDragLeave(ev){ ev.currentTarget.classList.remove('dragover'); }
function kanbanDrop(ev,status){
  ev.preventDefault(); ev.currentTarget.classList.remove('dragover');
  const id = dragTaskId || ev.dataTransfer.getData('text/plain');
  const t = getTask(id); if(!t) return;
  if(t.status===status) return;
  const old=t.status; t.status=status; t.updatedAt=new Date().toISOString();
  if(status==='Concluído'){ t.percent=100; t.completedAt=todayISO(); if(t.checklist) t.checklist.forEach(c=>c.done=true); }
  else if(old==='Concluído'){ t.completedAt=null; }
  addHistory('Mudança de status', t.name, `${old} → ${status} (kanban)`);
  dragTaskId=null; renderAll();
}

/* ---------------------------------------------------------------------
   15. VIEW: CRONOGRAMA (GANTT) — #4
--------------------------------------------------------------------- */
function renderGanttView(){
  const el = document.getElementById('view-gantt');
  const filtered = getFilteredTasks();
  const withDates = filtered.filter(t=>t.startDate && t.dueDate);
  if(!withDates.length){ el.innerHTML = '<div class="panel"><div class="empty-state">Nenhuma tarefa com datas definidas para exibir no cronograma.</div></div>'; return; }

  let minD = withDates.reduce((m,t)=> t.startDate<m?t.startDate:m, withDates[0].startDate);
  let maxD = withDates.reduce((m,t)=> t.dueDate>m?t.dueDate:m, withDates[0].dueDate);
  minD = addDays(minD,-2); maxD = addDays(maxD,2);
  const totalDays = Math.max(1, daysBetween(minD,maxD));
  const pctOf = iso => clamp(daysBetween(minD,iso)/totalDays*100, 0, 100);
  const todayPct = pctOf(todayISO());

  // marcadores semanais
  let weekMarks = ''; for(let d=0; d<=totalDays; d+=7){ const iso=addDays(minD,d); weekMarks += `<div style="position:absolute;left:${d/totalDays*100}%;top:0;bottom:0;border-left:1px dashed var(--border);font-size:9.5px;color:var(--text-faint);padding-left:3px">${fmtBR(iso)}</div>`; }

  let rows = `<div class="gantt-header"><div class="gantt-label">Fase / Tarefa</div>
    <div class="gantt-track" style="position:relative">${weekMarks}</div></div>`;

  state.phases.forEach(ph=>{
    const ts = sortTasks(withDates.filter(t=>t.phase===ph.id));
    if(!ts.length) return;
    rows += `<div class="gantt-phase-head">${escapeHtml(ph.name)} <span style="color:var(--text-muted);font-weight:600">(${ts.length} tarefas)</span></div>`;
    ts.forEach(t=>{
      const left = pctOf(t.startDate), right = pctOf(t.dueDate);
      const width = Math.max(1.2, right-left);
      const dur = Math.max(1, daysBetween(t.startDate,t.dueDate));
      rows += `<div class="gantt-row">
        <div class="gantt-label">${escapeHtml(t.name)}<div class="g-sub">${fmtBR(t.startDate)} → ${fmtBR(t.dueDate)} · ${dur}d</div></div>
        <div class="gantt-track">
          <div class="gantt-today" style="left:${todayPct}%"></div>
          <div class="gantt-bar" title="${escapeHtml(t.name)}: ${fmtBR(t.startDate)} a ${fmtBR(t.dueDate)} (${dur} dias) — ${t.status}"
               style="left:${left}%;width:${width}%;background:${STATUS_COLOR[t.status]}" onclick="openTaskModal('${t.id}')">${taskPercent(t)}%</div>
        </div>
      </div>`;
    });
  });
  const noPhase = sortTasks(withDates.filter(t=>!getPhase(t.phase)));
  if(noPhase.length){
    rows += `<div class="gantt-phase-head">Sem fase</div>`;
    noPhase.forEach(t=>{
      const left=pctOf(t.startDate), width=Math.max(1.2,pctOf(t.dueDate)-pctOf(t.startDate));
      rows += `<div class="gantt-row"><div class="gantt-label">${escapeHtml(t.name)}</div><div class="gantt-track">
        <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${STATUS_COLOR[t.status]}" onclick="openTaskModal('${t.id}')">${taskPercent(t)}%</div></div></div>`;
    });
  }

  el.innerHTML = `<div class="panel-head"><h3 style="margin-bottom:10px">📅 Cronograma / Gantt</h3><span class="hint">Linha vermelha = hoje (${fmtBR(todayISO())})</span></div>
    <div class="gantt-scroll">${rows}</div>`;
}

/* ---------------------------------------------------------------------
   16. VIEW: CALENDÁRIO — #4
--------------------------------------------------------------------- */
const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW_NAMES = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function calNav(delta){ calState.month += delta; if(calState.month<0){calState.month=11;calState.year--;} if(calState.month>11){calState.month=0;calState.year++;} renderCurrentView(); }
function calToday(){ calState={year:new Date().getFullYear(),month:new Date().getMonth()}; renderCurrentView(); }

function renderCalendarView(){
  const el = document.getElementById('view-calendar');
  const {year,month} = calState;
  const first = new Date(year,month,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const daysInPrevMonth = new Date(year,month,0).getDate();
  const filtered = getFilteredTasks();
  const tasksByDate = {};
  filtered.forEach(t=>{
    if(t.dueDate){ (tasksByDate[t.dueDate]=tasksByDate[t.dueDate]||[]).push({t,kind:'due'}); }
    if(t.startDate && t.startDate!==t.dueDate){ (tasksByDate[t.startDate]=tasksByDate[t.startDate]||[]).push({t,kind:'start'}); }
  });

  let cells = '';
  for(let i=startOffset-1;i>=0;i--){ const d=daysInPrevMonth-i; cells += calCell(year,month-1,d,true,tasksByDate); }
  for(let d=1; d<=daysInMonth; d++){ cells += calCell(year,month,d,false,tasksByDate); }
  const totalCells = startOffset+daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){ cells += calCell(year,month+1,d,true,tasksByDate); }

  el.innerHTML = `
    <div class="cal-nav">
      <button class="btn btn-icon" onclick="calNav(-1)">‹</button>
      <h3>${MONTH_NAMES[month]} ${year}</h3>
      <button class="btn btn-icon" onclick="calNav(1)">›</button>
      <button class="btn btn-sm" onclick="calToday()">Hoje</button>
    </div>
    <div class="cal-grid">
      ${DOW_NAMES.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>`;
}
function calCell(y,m,d,other,tasksByDate){
  const nd = new Date(y,m,d);
  const iso = nd.getFullYear()+'-'+pad2(nd.getMonth()+1)+'-'+pad2(nd.getDate());
  const isToday = iso===todayISO();
  const items = (tasksByDate[iso]||[]).slice(0,4);
  const extra = (tasksByDate[iso]||[]).length - items.length;
  return `<div class="cal-cell ${other?'other-month':''} ${isToday?'today':''}">
    <div class="cal-daynum">${d}</div>
    ${items.map(x=>`<div class="cal-chip" style="background:${STATUS_COLOR[x.t.status]}22;color:${STATUS_COLOR[x.t.status]}" title="${escapeHtml(x.t.name)}" onclick="openTaskModal('${x.t.id}')">${x.kind==='start'?'▶ ':''}${escapeHtml(x.t.name)}</div>`).join('')}
    ${extra>0? `<div style="color:var(--text-faint);font-size:10px">+${extra} mais</div>`:''}
  </div>`;
}

/* ---------------------------------------------------------------------
   17c. VIEW: CENTRAL DE LEADS — captação x meta de faturamento do mês
--------------------------------------------------------------------- */
let leadStatusFilter = '';
function fmtBRL(n){ return (Number(n)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0}); }

/* Quantas vendas e quantos leads são necessários para bater a meta do mês,
   a partir do ticket médio e de uma taxa de conversão (lead → venda) estimada. */
function computeLeadsGoalStats(){
  const cfg = state.leadsGoal;
  const vendasNecessarias = cfg.avgTicket>0 ? Math.ceil(cfg.targetRevenue/cfg.avgTicket) : 0;
  const leadsNecessarios = cfg.conversionRate>0 ? Math.ceil(vendasNecessarias/(cfg.conversionRate/100)) : 0;
  const ganhos = state.leads.filter(l=>l.status==='Ganho');
  const valorGanho = ganhos.reduce((s,l)=>s+(Number(l.value)||0),0);
  const totalLeads = state.leads.length;
  const pctMeta = cfg.targetRevenue>0 ? Math.min(100, Math.round(valorGanho/cfg.targetRevenue*100)) : 0;
  const taxaReal = totalLeads>0 ? Math.round(ganhos.length/totalLeads*100) : null;
  const leadsFaltantes = Math.max(0, leadsNecessarios-totalLeads);
  return {vendasNecessarias, leadsNecessarios, valorGanho, vendasGanhas:ganhos.length, totalLeads, pctMeta, taxaReal, leadsFaltantes};
}
function getFilteredLeads(){
  return leadStatusFilter ? state.leads.filter(l=>l.status===leadStatusFilter) : state.leads;
}
function updateLeadsGoalField(field, value){
  let v = Number(value)||0;
  v = field==='conversionRate' ? clamp(v,1,100) : Math.max(0,v);
  state.leadsGoal[field] = v;
  save(); renderCurrentView();
}

  const el = document.getElementById('view-leads');

  const s = computeLeadsGoalStats();
  const leads = getFilteredLeads();

  el.innerHTML = `

        <div class="form-group"><label>Meta de faturamento (R$)</label><input type="number" min="0" step="100" value="${cfg.targetRevenue}" onchange="updateLeadsGoalField('targetRevenue',this.value)"></div>
        <div class="form-group"><label>Ticket médio do produto (R$)</label><input type="number" min="0" step="50" value="${cfg.avgTicket}" onchange="updateLeadsGoalField('avgTicket',this.value)"></div>
        <div class="form-group"><label>Taxa de conversão estimada (%)</label><input type="number" min="1" max="100" step="1" value="${cfg.conversionRate}" onchange="updateLeadsGoalField('conversionRate',this.value)"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-muted);margin-top:4px;padding:12px 14px;background:var(--primary-soft);border-radius:10px">
        <div>💰 Para faturar <b style="color:var(--text)">${fmtBRL(cfg.targetRevenue)}</b> com um ticket médio de <b style="color:var(--text)">${fmtBRL(cfg.avgTicket)}</b>, você precisa fechar <b style="color:var(--primary)">${s.vendasNecessarias} vendas</b> este mês.</div>
        <div>🧲 Considerando uma conversão de leads em vendas de <b style="color:var(--text)">${cfg.conversionRate}%</b>, isso significa captar cerca de <b style="color:var(--primary);font-size:15px">${s.leadsNecessarios} leads</b> ao longo do mês.</div>
      </div>
    </div>

    <div class="grid-cards">
      <div class="stat-card">
        <div class="lbl">Valor conquistado</div>
        <div class="val" style="color:var(--success);font-size:21px">${fmtBRL(s.valorGanho)}</div>
        <div class="progress" style="margin-top:8px"><span style="width:${s.pctMeta}%;background:var(--success)"></span></div>
        <div class="sub">${s.pctMeta}% da meta de ${fmtBRL(cfg.targetRevenue)}</div>
      </div>
      <div class="stat-card"><div class="lbl">Vendas fechadas</div><div class="val">${s.vendasGanhas}<span style="font-size:14px;color:var(--text-faint)"> / ${s.vendasNecessarias}</span></div><div class="sub">Leads marcados como "Ganho"</div></div>
      <div class="stat-card"><div class="lbl">Leads captados</div><div class="val">${s.totalLeads}<span style="font-size:14px;color:var(--text-faint)"> / ${s.leadsNecessarios}</span></div><div class="sub">${s.leadsFaltantes>0? `Faltam ${s.leadsFaltantes} leads`:'Meta de captação atingida 🎉'}</div></div>
      <div class="stat-card"><div class="lbl">Conversão real</div><div class="val">${s.taxaReal===null?'—':s.taxaReal+'%'}</div><div class="sub">${s.taxaReal===null?'Ainda sem leads suficientes':'Ganhos ÷ total de leads'}</div></div>
    </div>

    <div class="filter-bar">
      <button class="btn btn-sm ${leadStatusFilter===''?'btn-primary':''}" onclick="leadStatusFilter='';renderCurrentView()">Todos (${state.leads.length})</button>
      ${LEAD_STATUS_LIST.map(st=>{
        const n = state.leads.filter(l=>l.status===st).length;
        return `<button class="btn btn-sm ${leadStatusFilter===st?'btn-primary':''}" style="${leadStatusFilter===st?'':'color:'+LEAD_STATUS_COLOR[st]}" onclick="leadStatusFilter='${st}';renderCurrentView()">${st} (${n})</button>`;
      }).join('')}
      <div class="spacer"></div>
      <button class="btn btn-sm" onclick="exportLeadsCSV()">${svgIcon('download')} Exportar CSV</button>
    </div>

    <datalist id="leadSourceList">${LEAD_SOURCE_SUGGESTIONS.map(sg=>`<option value="${escapeHtml(sg)}">`).join('')}</datalist>

    <div class="table-wrap"><table class="leads-table">
      <thead><tr>
        <th>Nome</th><th>Contato</th><th>Origem</th><th>Status</th><th>Valor (R$)</th><th>Captado em</th><th>Próximo contato</th><th>Observações</th><th>Ações</th>
      </tr></thead>
      <tbody>${leads.length? leads.map(leadRow).join('') : `<tr><td colspan="9"><div class="empty-state">Nenhum lead ainda. Clique em "+ Adicionar lead" e comece sua planilha de captação.</div></td></tr>`}</tbody>
    </table></div>
    <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="addLeadRow()">${svgIcon('plus')} Adicionar lead</button>
  `;
}
function leadRow(l){
  const overdueNext = l.nextActionDate && l.nextActionDate<todayISO() && l.status!=='Ganho' && l.status!=='Perdido';
  return `<tr data-lead-id="${l.id}" class="${l.status==='Ganho'?'row-done':''} ${l.status==='Perdido'?'row-lost':''}">
    <td class="lead-cell"><input type="text" class="cell-input" value="${escapeHtml(l.name)}" placeholder="Nome do lead" onchange="updateLeadField('${l.id}','name',this.value)"></td>
    <td class="lead-cell"><input type="text" class="cell-input" value="${escapeHtml(l.contact)}" placeholder="Telefone / e-mail" onchange="updateLeadField('${l.id}','contact',this.value)"></td>
    <td class="lead-cell"><input type="text" class="cell-input" list="leadSourceList" value="${escapeHtml(l.source)}" placeholder="Canal" onchange="updateLeadField('${l.id}','source',this.value)"></td>
    <td class="lead-cell"><select class="mini-select" style="color:${LEAD_STATUS_COLOR[l.status]};font-weight:700" onchange="updateLeadField('${l.id}','status',this.value)">${selectOptions(LEAD_STATUS_LIST.map(st=>({id:st,name:st})), l.status)}</select></td>
    <td class="lead-cell"><input type="number" class="cell-input" min="0" step="50" style="max-width:100px" value="${l.value}" onchange="updateLeadField('${l.id}','value',this.value)"></td>
    <td class="lead-cell"><input type="date" class="cell-input" value="${l.capturedAt||''}" onchange="updateLeadField('${l.id}','capturedAt',this.value)"></td>
    <td class="lead-cell"><input type="date" class="cell-input ${overdueNext?'cell-overdue':''}" value="${l.nextActionDate||''}" onchange="updateLeadField('${l.id}','nextActionDate',this.value)"></td>
    <td class="lead-cell"><input type="text" class="cell-input" value="${escapeHtml(l.notes)}" placeholder="Observações" onchange="updateLeadField('${l.id}','notes',this.value)"></td>
    <td class="actions-cell">
      ${l.status!=='Ganho'? `<button class="btn btn-icon btn-ghost" title="Marcar como ganho" onclick="markLeadWon('${l.id}')">${svgIcon('check')}</button>`:''}
      ${l.status!=='Perdido'? `<button class="btn btn-icon btn-ghost" title="Marcar como perdido" onclick="markLeadLost('${l.id}')">${svgIcon('x')}</button>`:''}
      ${(l.status==='Ganho'||l.status==='Perdido')? `<button class="btn btn-icon btn-ghost" title="Reabrir" onclick="reopenLead('${l.id}')">${svgIcon('undo')}</button>`:''}
      <button class="btn btn-icon btn-ghost" title="Excluir" onclick="deleteLead('${l.id}')">${svgIcon('trash')}</button>
    </td>
  </tr>`;
}
function updateLeadField(id, field, value){
  const l = state.leads.find(x=>x.id===id); if(!l) return;
  l[field] = field==='value' ? Math.max(0, Number(value)||0) : value;
  renderAll();
}
function addLeadRow(){
  const l = {id:uid('l'), name:'', contact:'', source:'', status:'Novo', value:state.leadsGoal.avgTicket,
    capturedAt:todayISO(), nextActionDate:'', notes:'', createdAt:new Date().toISOString(), isDemo:false};
  state.leads.unshift(l);
  renderAll();
  setTimeout(()=>{ const inp = document.querySelector(`tr[data-lead-id="${l.id}"] input`); if(inp) inp.focus(); }, 30);
}
function markLeadWon(id){
  const l = state.leads.find(x=>x.id===id); if(!l) return;
  l.status='Ganho';
  addHistory('Lead ganho', l.name||'(sem nome)');
  renderAll(); toast('Lead marcado como ganho 🎉');
}
function markLeadLost(id){
  const l = state.leads.find(x=>x.id===id); if(!l) return;
  l.status='Perdido';
  addHistory('Lead perdido', l.name||'(sem nome)');
  renderAll(); toast('Lead marcado como perdido','warn');
}
function reopenLead(id){
  const l = state.leads.find(x=>x.id===id); if(!l) return;
  l.status='Contatado';
  addHistory('Lead editado', l.name||'(sem nome)', 'Reaberto');
  renderAll(); toast('Lead reaberto');
}
function deleteLead(id){
  const l = state.leads.find(x=>x.id===id); if(!l) return;
  confirmAction(`Excluir o lead "${l.name||'sem nome'}"?`, ()=>{
    state.leads = state.leads.filter(x=>x.id!==id);
    addHistory('Lead excluído', l.name||'(sem nome)');
    renderAll(); toast('Lead excluído','warn');
  }, 'Excluir lead');
}
function exportLeadsCSV(){
  const headers = ['Nome','Contato','Origem','Status','Valor (R$)','Captado em','Próximo contato','Observações'];
  const rows = state.leads.map(l=>[l.name, l.contact, l.source, l.status, l.value, fmtBR(l.capturedAt), fmtBR(l.nextActionDate), l.notes]);
  const csv = '﻿'+[headers, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadBlob(csv, `leads-${todayISO()}.csv`, 'text/csv;charset=utf-8');
}

--------------------------------------------------------------------- */
const HISTORY_ICON = {'Tarefa criada':'plus','Tarefa editada':'edit','Mudança de status':'chevDown','Tarefa concluída':'check','Tarefa excluída':'trash',
  'Meta criada':'flag','Meta editada':'edit','Meta concluída':'check','Meta excluída':'trash',
  'Lead ganho':'check','Lead perdido':'x','Lead editado':'edit','Lead excluído':'trash'};
function renderHistoryView(){
  const el = document.getElementById('view-history');
  el.innerHTML = `<div class="panel-head"><h3>🕘 Histórico de alterações</h3><span class="hint">${state.history.length} registros</span></div>
    <div class="panel">${state.history.length? state.history.map(h=>{
      const d = new Date(h.date);
      return `<div class="hist-item">
        <div class="hist-time">${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</div>
        <div class="hist-icon">${svgIcon(HISTORY_ICON[h.action]||'clock', 'style="width:14px;height:14px"')}</div>
        <div><b>${escapeHtml(h.action)}</b> — ${escapeHtml(h.taskName)}${h.details?`<div style="color:var(--text-muted);font-size:12px">${escapeHtml(h.details)}</div>`:''}</div>
      </div>`;
    }).join('') : '<div class="empty-state">Nenhum registro ainda.</div>'}</div>`;
}

function saveProjectSettings(){

  p.description = document.getElementById('s_description').value.trim();

function renderPhaseMgr(){
  return state.phases.slice().sort((a,b)=>a.order-b.order).map((ph,idx,arr)=>`

      <button class="btn btn-icon btn-ghost btn-sm" title="Mover para baixo" ${idx===arr.length-1?'disabled':''} onclick="movePhase('${ph.id}',1)">↓</button>

function addPhase(){
  const inp = document.getElementById('newPhaseName'); const v = inp.value.trim(); if(!v) return;
  state.phases.push({id:uid('ph'), name:v, order:state.phases.length, collapsed:false});
  inp.value=''; save(); renderCurrentView(); toast('Fase adicionada');
}
function renamePhase(id,name){ const ph=getPhase(id); if(ph && name.trim()){ ph.name=name.trim(); save(); } }
function movePhase(id,dir){
  const arr = state.phases.slice().sort((a,b)=>a.order-b.order);
  const i = arr.findIndex(p=>p.id===id); const j=i+dir;
  if(j<0||j>=arr.length) return;
  [arr[i].order, arr[j].order] = [arr[j].order, arr[i].order];
  save(); renderCurrentView();
}
function deletePhase(id){
  confirmAction('Excluir esta fase? As tarefas associadas ficarão sem fase.', ()=>{
    state.phases = state.phases.filter(p=>p.id!==id);
    state.tasks.forEach(t=>{ if(t.phase===id) t.phase=''; });
    save(); renderCurrentView(); toast('Fase removida','warn');
  }, 'Excluir fase');
}

function renderCategoryMgr(){

    <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
      <input type="color" value="${c.color}" onchange="recolorCategory('${c.id}',this.value)">
      <input type="text" value="${escapeHtml(c.name)}" onchange="renameCategory('${c.id}',this.value)" style="flex:1">

  state.categories.push({id:uid('cat'), name:v, color});

function renameCategory(id,name){ const c=getCategory(id); if(c && name.trim()){ c.name=name.trim(); save(); } }
function recolorCategory(id,color){ const c=getCategory(id); if(c){ c.color=color; save(); renderCurrentView(); } }

    state.tasks.forEach(t=>{ if(t.category===id) t.category=''; });

  }, 'Excluir categoria');

function clearDemoData(){

/* ---------------------------------------------------------------------
   20. EXPORTAÇÃO / IMPORTAÇÃO / IMPRESSÃO — #13, #14
--------------------------------------------------------------------- */
/* Quando publicado como Artifact, o navegador não permite que a página baixe
   arquivos diretamente — usamos a capability "downloads" da plataforma nesse
   caso. Ao abrir o arquivo .html localmente (window.claude não existe), cai
   automaticamente no download tradicional via link. */
const downloadsCapPromise = (typeof window!=='undefined' && window.claude && window.claude.use)
  ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);

async function downloadBlob(content, filename, mime){
  const downloads = await downloadsCapPromise;
  if(downloads){
    try{
      await downloads.save({filename, data: content});
      toast('Arquivo salvo: '+filename);
      return;
    }catch(err){
      if(err && err.code==='declined') return; // usuário cancelou o salvamento
      // qualquer outro erro: tenta o método tradicional abaixo como reserva
    }
  }
  try{
    const blob = new Blob([content], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    toast('Arquivo baixado: '+filename);
  }catch(err){
    toast('Não foi possível salvar o arquivo neste ambiente.', 'error');
  }
}
function exportJSON(){
  downloadBlob(JSON.stringify(state,null,2), `backup-projeto-${todayISO()}.json`, 'application/json');
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      confirmAction('Importar este backup substituirá todos os dados atuais. Deseja continuar?', ()=>{
        state = normalizeState(parsed);
        applyTheme(); buildSidebarNav(); save(); switchView('dashboard');
        toast('Backup importado com sucesso');
      }, 'Importar backup');
    }catch(err){ toast('Arquivo inválido. Selecione um backup .json gerado por este sistema.', 'error'); }
  };
  reader.readAsText(file);
  document.getElementById('importFileInput').value = '';
}
function csvEscape(v){ const s=String(v==null?'':v); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCSV(){
  const headers = ['Nome','Descrição','Categoria','Fase','Início','Prazo','Responsável','Status','Prioridade','Importância','Percentual','Tags','Favorita'];
  const rows = state.tasks.map(t=>[
    t.name, t.description, (getCategory(t.category)||{}).name||'', phaseName(t.phase), fmtBR(t.startDate), fmtBR(t.dueDate),
    t.owner, t.status, t.priority, t.importance, taskPercent(t)+'%', (t.tags||[]).join(' '), t.favorite?'Sim':'Não'
  ]);
  const csv = '﻿'+[headers, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadBlob(csv, `tarefas-${todayISO()}.csv`, 'text/csv;charset=utf-8');
}
function printView(viewId){
  switchView(viewId);
  document.getElementById('view-'+viewId).classList.add('printing');
  setTimeout(()=>{ window.print(); document.getElementById('view-'+viewId).classList.remove('printing'); }, 60);
}
